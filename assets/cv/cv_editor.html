<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no"/>
<title>CV Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&family=Playfair+Display:wght@400;700&family=Merriweather:wght@400;700&family=Lato:wght@400;700&family=Montserrat:wght@400;700&family=Poppins:wght@400;700&family=Inter:wght@400;700&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet"/>
<script type="module" defer src="https://cdn.jsdelivr.net/npm/ionicons@7/dist/ionicons/ionicons.esm.js"></script>
<script nomodule defer src="https://cdn.jsdelivr.net/npm/ionicons@7/dist/ionicons/ionicons.js"></script>
<style>
:root {
  --acc:#FA6559; --acc-rgb:250,101,89; --acc-c:#fff;
  --bg:#d8dce3; --tb:#ffffff; --border:#e2e5eb;
  --text:#1a1a1a; --sub:#8a9099; --pill:#f0f2f5;
  --canvas-bg:#ffffff;
  --shadow-tb:0 1px 0 var(--border),0 2px 16px rgba(0,0,0,.07);
  --ctx-bg:#1c1c1e; --ctx-text:#f5f5f5;
}
body[data-theme="dark"] {
  --bg:#111113; --tb:#1c1c1e; --border:#2c2c2e;
  --text:#f0ece8; --sub:#6e6e73; --pill:#2c2c2e;
  --canvas-bg:#1f1f21; --shadow-tb:0 1px 0 var(--border),0 2px 16px rgba(0,0,0,.4);
}
*,*::before,*::after { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; margin:0; background:var(--bg); color:var(--text); font-family:'Roboto',sans-serif; overflow:hidden; transition:background .3s,color .3s; }
#app { display:flex; flex-direction:column; height:100%; height:100dvh; }

/* ── TOOLBAR ── */
#toolbar {
  background:var(--tb); box-shadow:var(--shadow-tb);
  padding:5px 10px; display:flex; align-items:center; gap:2px;
  flex-shrink:0; overflow-x:auto; scrollbar-width:none; z-index:200; position:relative;
}
#toolbar::-webkit-scrollbar { display:none; }

.tb-btn {
  min-width:36px; height:36px; border:none; border-radius:10px;
  background:transparent; color:var(--text);
  display:flex; align-items:center; justify-content:center; gap:4px;
  cursor:pointer; flex-shrink:0; padding:0 7px;
  transition:background .12s,color .12s,transform .08s;
  font-family:'Roboto',sans-serif; font-size:.72rem; font-weight:800; white-space:nowrap;
}
.tb-btn ion-icon { font-size:18px; pointer-events:none; }
.tb-btn svg { pointer-events:none; }
.tb-btn:hover { background:var(--pill); }
.tb-btn:active { transform:scale(.91); }
.tb-btn.on,.tb-btn.active { background:rgba(var(--acc-rgb),.13); color:var(--acc); }
.tb-btn.on svg,.tb-btn.active svg { fill:var(--acc) !important; }
.tb-sep { width:1px; height:20px; background:var(--border); margin:0 3px; flex-shrink:0; }

/* Formato group */
.tb-group { display:flex; align-items:center; background:var(--pill); border-radius:10px; padding:3px; gap:1px; flex-shrink:0; }
.fb { width:32px; height:32px; border:none; background:transparent; border-radius:7px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; padding:0; }
.fb svg { pointer-events:none; fill:var(--sub); transition:fill .1s; }
.fb:active,.fb.on { background:rgba(var(--acc-rgb),.15); }
.fb.on svg { fill:var(--acc) !important; }

/* Pill dropdown */
.tb-pill { height:34px; border:none; border-radius:10px; background:var(--pill); color:var(--text); padding:0 22px 0 10px; font-family:'Roboto',sans-serif; font-size:.75rem; font-weight:700; cursor:pointer; white-space:nowrap; flex-shrink:0; position:relative; display:flex; align-items:center; }
.tb-pill::after { content:''; position:absolute; right:7px; top:50%; transform:translateY(-50%); border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid var(--sub); pointer-events:none; }
.tb-pill:active { opacity:.7; }

.color-dot { width:17px; height:17px; border-radius:50%; background:#111; border:2px solid rgba(0,0,0,.2); flex-shrink:0; pointer-events:none; }
.color-dot-bg { border-radius:3px; background:#ffff00; }

/* toolbar modes */
#main-tb { display:flex; align-items:center; gap:2px; flex:1; }
#txt-tb   { display:none; align-items:center; gap:2px; flex:1; }
#txt-tb.show { display:flex; }

/* ── VIEWPORT ── */
#wrap { flex:1; overflow:hidden; position:relative; cursor:default; user-select:none; touch-action:none; background-color:var(--bg); background-image:radial-gradient(circle,rgba(0,0,0,.1) 1px,transparent 1px); background-size:22px 22px; }
#wrap.panning { cursor:grabbing; }
#wrap.tool-text { cursor:crosshair; }
#wrap.tool-draw { cursor:none; }
#viewport { position:absolute; top:0; left:0; transform-origin:0 0; }
#viewport.smooth { transition:transform .22s cubic-bezier(.25,.8,.25,1); }

/* ── CANVAS A4 ── */
#canvas { position:relative; background:var(--canvas-bg); box-shadow:0 0 0 1px rgba(0,0,0,.07),0 6px 48px rgba(0,0,0,.2); border-radius:3px; transition:background-color .3s; }

/* ── ELEMENTOS ── */
.wb-el { position:absolute; touch-action:none; cursor:move; }
.wb-el.selected { outline:2.5px solid var(--acc); outline-offset:1px; }
.wb-el[data-locked="1"] { cursor:default; }
.wb-img { display:block; width:100%; height:100%; object-fit:contain; pointer-events:none; border-radius:3px; }
.wb-text { width:100%; height:100%; padding:10px 12px; font-family:'Roboto',sans-serif; font-size:16px; color:#1a1a1a; word-break:break-word; overflow:hidden; white-space:pre-wrap; line-height:1.5; background:transparent; }
.wb-text.editing { outline:none; cursor:text; overflow:auto; }

/* Handles */
.rh { position:absolute; width:10px; height:10px; border-radius:50%; background:#fff; border:2px solid var(--acc); z-index:20; transform:translate(-50%,-50%); box-shadow:0 1px 4px rgba(0,0,0,.25); }
.rh-tl{top:0;left:0;cursor:nwse-resize} .rh-tc{top:0;left:50%;cursor:ns-resize} .rh-tr{top:0;left:100%;cursor:nesw-resize}
.rh-ml{top:50%;left:0;cursor:ew-resize} .rh-mr{top:50%;left:100%;cursor:ew-resize}
.rh-bl{top:100%;left:0;cursor:nesw-resize} .rh-bc{top:100%;left:50%;cursor:ns-resize} .rh-br{top:100%;left:100%;cursor:nwse-resize}
.rot-line { position:absolute; width:1px; height:22px; background:var(--acc); top:-22px; left:50%; transform:translateX(-50%); pointer-events:none; }
.rot-h { position:absolute; width:22px; height:22px; border-radius:50%; background:var(--acc); top:-46px; left:50%; transform:translateX(-50%); cursor:grab; display:flex; align-items:center; justify-content:center; z-index:20; box-shadow:0 2px 8px rgba(var(--acc-rgb),.4); }
.rot-h:active { cursor:grabbing; }
.rot-h ion-icon { font-size:12px; color:#fff; pointer-events:none; }

/* ── DRAW CANVAS ── */
#draw-canvas { position:absolute; top:0; left:0; pointer-events:none; border-radius:3px; }
#draw-canvas.active { pointer-events:all; }
#draw-cursor { position:fixed; border-radius:50%; border:2px solid var(--acc); pointer-events:none; z-index:9999; transform:translate(-50%,-50%); display:none; transition:width .08s,height .08s; }

/* ── CONTEXT TOOLBAR ── */
#ctx-tb { position:fixed; z-index:600; display:none; background:var(--ctx-bg); border-radius:100px; padding:4px 8px; gap:2px; align-items:center; box-shadow:0 6px 28px rgba(0,0,0,.38); }
#ctx-tb.show { display:flex; }
.ctx-btn { width:32px; height:32px; border:none; border-radius:8px; background:transparent; color:var(--ctx-text); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .12s; }
.ctx-btn ion-icon { font-size:16px; pointer-events:none; }
.ctx-btn:hover { background:rgba(255,255,255,.12); }
.ctx-btn.danger { color:#ff6b60; }
.ctx-btn.danger:hover { background:rgba(255,107,96,.18); }
.ctx-sep { width:1px; height:18px; background:rgba(255,255,255,.15); margin:0 2px; }

/* ── OVERLAY / PANEL ── */
.overlay { display:none; position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,.45); backdrop-filter:blur(5px); align-items:flex-end; justify-content:center; }
.overlay.open { display:flex; }
.panel { background:var(--tb); border-radius:22px 22px 0 0; padding:0 20px 36px; width:100%; max-width:480px; max-height:80vh; overflow-y:auto; animation:slideUp .22s cubic-bezier(.32,1.1,.6,1); box-shadow:0 -4px 40px rgba(0,0,0,.25); }
@keyframes slideUp { from{transform:translateY(60px);opacity:0} to{transform:translateY(0);opacity:1} }
.panel-handle { display:flex; justify-content:center; padding:12px 0 6px; position:sticky; top:0; background:var(--tb); z-index:1; }
.panel-handle-bar { width:40px; height:4px; border-radius:2px; background:var(--border); }
.panel-title { font-size:15px; font-weight:800; margin-bottom:14px; color:var(--text); }
.sec-label { font-size:9.5px; font-weight:800; color:var(--sub); text-transform:uppercase; letter-spacing:.1em; margin-bottom:10px; margin-top:18px; }
.sec-label:first-of-type { margin-top:0; }

/* Grid de elementos */
.el-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:6px; }
.el-btn { display:flex; flex-direction:column; align-items:center; gap:7px; padding:13px 6px; border:1.5px solid var(--border); border-radius:13px; background:transparent; cursor:pointer; transition:border-color .15s,background .12s,transform .08s; color:var(--text); }
.el-btn:hover { border-color:var(--acc); background:rgba(var(--acc-rgb),.06); }
.el-btn:active { transform:scale(.92); }
.el-btn span { font-size:.62rem; font-weight:700; color:var(--sub); text-align:center; }
.el-ico { width:32px; height:32px; display:flex; align-items:center; justify-content:center; }
.el-ico ion-icon { font-size:20px; color:var(--text); }

/* Mini shape previews */
.sh-rect     { width:26px; height:18px; background:var(--text); border-radius:2px; }
.sh-circle   { width:22px; height:22px; background:var(--text); border-radius:50%; }
.sh-triangle { width:0; height:0; border-left:13px solid transparent; border-right:13px solid transparent; border-bottom:22px solid var(--text); }
.sh-line     { width:26px; height:3px; background:var(--text); border-radius:1px; }
.sh-arrow    { position:relative; width:26px; height:3px; background:var(--text); border-radius:1px; }
.sh-arrow::after { content:''; position:absolute; right:-1px; top:-4px; border-left:8px solid var(--text); border-top:5px solid transparent; border-bottom:5px solid transparent; }
.sh-sticky   { width:20px; height:20px; background:#ffd60a; border-radius:3px; }

/* ── TOOLS POPUP ── */
#tools-popup { display:none; position:fixed; z-index:900; background:var(--tb); border-radius:16px; padding:10px; box-shadow:0 6px 32px rgba(0,0,0,.22); min-width:170px; animation:popIn .15s cubic-bezier(.32,1.1,.6,1); }
#tools-popup.open { display:block; }
@keyframes popIn { from{opacity:0;transform:scale(.88) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }
.tool-item { display:flex; align-items:center; gap:10px; padding:10px; border:none; background:transparent; border-radius:10px; cursor:pointer; width:100%; color:var(--text); font-family:'Roboto',sans-serif; font-size:.85rem; font-weight:600; transition:background .1s; text-align:left; }
.tool-item ion-icon { font-size:18px; color:var(--sub); flex-shrink:0; }
.tool-item:hover { background:var(--pill); }
.tool-item.active { background:rgba(var(--acc-rgb),.12); color:var(--acc); }
.tool-item.active ion-icon { color:var(--acc); }
.tool-sep { height:1px; background:var(--border); margin:4px 0; }
.tool-slider-row { padding:6px 10px 8px; }
.tool-slider-row label { font-size:.7rem; font-weight:700; color:var(--sub); display:block; margin-bottom:5px; }
input[type=range] { accent-color:var(--acc); width:100%; margin:0; }
.tool-colors { display:flex; gap:7px; padding:4px 10px 8px; flex-wrap:wrap; }
.t-sw { width:22px; height:22px; border-radius:50%; cursor:pointer; border:2.5px solid transparent; box-shadow:0 1px 3px rgba(0,0,0,.18); transition:transform .1s,border-color .1s; }
.t-sw:hover,.t-sw.active { transform:scale(1.2); border-color:var(--acc); }

/* ── TOAST ── */
.toast { position:fixed; bottom:calc(env(safe-area-inset-bottom,0px)+18px); left:50%; transform:translateX(-50%) translateY(12px); background:rgba(22,22,24,.92); color:#f5f5f5; font-family:'Space Mono',monospace; font-size:.72rem; font-weight:500; padding:8px 18px; border-radius:999px; white-space:nowrap; z-index:9999; opacity:0; transition:opacity .18s,transform .18s; pointer-events:none; letter-spacing:.02em; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ── ZOOM BADGE ── */
#zoom-badge{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+18px);right:16px;background:rgba(0,0,0,.55);color:#fff;font-family:'Space Mono',monospace;font-size:.62rem;font-weight:700;padding:5px 10px;border-radius:999px;z-index:500;pointer-events:none;letter-spacing:.05em;opacity:0;transition:opacity .25s;backdrop-filter:blur(4px)}
#zoom-badge.show{opacity:1}
/* ── LOADING ── */
#pdf-loading{display:none;position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.65);align-items:center;justify-content:center;flex-direction:column;gap:16px;backdrop-filter:blur(4px)}
#pdf-loading.show{display:flex}
.pdf-spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,.2);border-top:3px solid var(--acc);border-radius:50%;animation:_spin .7s linear infinite}
@keyframes _spin{to{transform:rotate(360deg)}}
#pdf-loading p{color:#fff;font-family:'Space Mono',monospace;font-size:.78rem;letter-spacing:.04em;margin:0}
</style>
</head>
<body>
<div id="app">

<!-- ══ TOOLBAR ══ -->
<div id="toolbar">

  <!-- Undo / Redo — Ionicons (sem SVG disponível) -->
  <button class="tb-btn" onclick="doUndo()" title="Desfazer"><ion-icon name="arrow-undo-outline"></ion-icon></button>
  <button class="tb-btn" onclick="doRedo()" title="Refazer"> <ion-icon name="arrow-redo-outline"></ion-icon></button>
  <div class="tb-sep"></div>

  <!-- ── MAIN TOOLBAR (4 botões) ── -->
  <div id="main-tb">
    <button class="tb-btn" onclick="openElements()" title="Elementos">
      <ion-icon name="shapes-outline"></ion-icon>Elementos
    </button>
    <button class="tb-btn" id="btn-txt" onclick="enterTextMode()" title="Texto">
      <ion-icon name="text-outline"></ion-icon>Texto
    </button>
    <button class="tb-btn" onclick="triggerGallery()" title="Galeria">
      <ion-icon name="image-outline"></ion-icon>Galeria
    </button>
    <button class="tb-btn" id="btn-tools" onclick="toggleToolsPopup()" title="Ferramentas">
      <ion-icon name="brush-outline"></ion-icon>Ferramentas
    </button>
    <button class="tb-btn" onclick="_bridge({action:'openTemplates'})" title="Templates"><ion-icon name="albums-outline"></ion-icon>Templates</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" onclick="fitScreen(true)" title="Ajustar"><ion-icon name="scan-outline"></ion-icon></button>
    <button class="tb-btn" onclick="zoomStep(1.2)" title="Zoom +"><ion-icon name="add-circle-outline"></ion-icon></button>
    <button class="tb-btn" onclick="zoomStep(.83)" title="Zoom -"><ion-icon name="remove-circle-outline"></ion-icon></button>
    <div class="tb-sep"></div>
    <button class="tb-btn" style="color:var(--acc)" onclick="exportPDF()" title="PDF"><ion-icon name="download-outline"></ion-icon>PDF</button>
  </div>

  <!-- ── TEXTO TOOLBAR (substitui main-tb quando activo) ── -->
  <div id="txt-tb">

    <!-- Voltar — SVG disponível no editor.html -->
    <button class="tb-btn" onclick="exitTextMode()" title="Voltar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="var(--text)">
        <path d="M.88,14.09,4.75,18a1,1,0,0,0,1.42,0h0a1,1,0,0,0,0-1.42L2.61,13H23a1,1,0,0,0,1-1h0a1,1,0,0,0-1-1H2.55L6.17,7.38A1,1,0,0,0,6.17,6h0A1,1,0,0,0,4.75,6L.88,9.85A3,3,0,0,0,.88,14.09Z"/>
      </svg>
    </button>
    <div class="tb-sep"></div>

    <!-- B I U S — SVGs disponíveis no editor.html -->
    <div class="tb-group">
      <button class="fb" id="fb-b" onclick="fmt('bold')">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M22,17a7,7,0,0,0-4.046-6.337A6.986,6.986,0,0,0,12,0H5A2,2,0,0,0,3,2V22a2,2,0,0,0,2,2H15A7.008,7.008,0,0,0,22,17ZM7,4h5a3,3,0,0,1,0,6H7Zm8,16H7V14h8a3,3,0,0,1,0,6Z"/></svg>
      </button>
      <button class="fb" id="fb-i" onclick="fmt('italic')">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M20,0H7A1,1,0,0,0,7,2h5.354L9.627,22H4a1,1,0,0,0,0,2H17a1,1,0,0,0,0-2H11.646L14.373,2H20a1,1,0,0,0,0-2Z"/></svg>
      </button>
      <button class="fb" id="fb-u" onclick="fmt('underline')">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12,20a8.009,8.009,0,0,0,8-8V1a1,1,0,0,0-2,0V12A6,6,0,0,1,6,12V1A1,1,0,0,0,4,1V12A8.009,8.009,0,0,0,12,20Z"/><path d="M23,22H1a1,1,0,0,0,0,2H23a1,1,0,0,0,0-2Z"/></svg>
      </button>
      <button class="fb" id="fb-s" onclick="fmt('strikeThrough')">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="m24,12c0,.553-.448,1-1,1H1c-.552,0-1-.447-1-1s.448-1,1-1h4.081c-1.863-1.003-3.081-2.97-3.081-5.151C2,2.624,4.624,0,7.848,0h8.235c3.262,0,5.917,2.654,5.917,5.917v1.083c0,.553-.448,1-1,1s-1-.447-1-1v-1.083c0-2.16-1.757-3.917-3.917-3.917H7.848c-2.122,0-3.848,1.727-3.848,3.849,0,1.732,1.167,3.26,2.84,3.714l5.293,1.438h10.867c.552,0,1,.447,1,1Zm-3.943,3.11c-.495.244-.698.844-.454,1.34.259.524.396,1.113.396,1.701,0,2.122-1.726,3.849-3.848,3.849H7.917c-2.16,0-3.917-1.757-3.917-3.917v-1.083c0-.553-.448-1-1-1s-1,.447-1,1v1.083c0,3.263,2.654,5.917,5.917,5.917h8.235c3.225,0,5.848-2.624,5.848-5.849,0-.894-.208-1.788-.604-2.588-.245-.494-.844-.699-1.339-.453Z"/></svg>
      </button>
    </div>
    <div class="tb-sep"></div>

    <!-- Alinhamentos — SVGs disponíveis no editor.html -->
    <div class="tb-group">
      <button class="fb" id="fb-jl" onclick="fmt('justifyLeft')">
        <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="2.5" width="14" height="1.5" rx=".75" fill="var(--sub)"/><rect x="1" y="6" width="10" height="1.5" rx=".75" fill="var(--sub)"/><rect x="1" y="9.5" width="14" height="1.5" rx=".75" fill="var(--sub)"/><rect x="1" y="13" width="8" height="1.5" rx=".75" fill="var(--sub)"/></svg>
      </button>
      <button class="fb" id="fb-jc" onclick="fmt('justifyCenter')">
        <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="2.5" width="14" height="1.5" rx=".75" fill="var(--sub)"/><rect x="3" y="6" width="10" height="1.5" rx=".75" fill="var(--sub)"/><rect x="1" y="9.5" width="14" height="1.5" rx=".75" fill="var(--sub)"/><rect x="4" y="13" width="8" height="1.5" rx=".75" fill="var(--sub)"/></svg>
      </button>
      <button class="fb" id="fb-jr" onclick="fmt('justifyRight')">
        <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="2.5" width="14" height="1.5" rx=".75" fill="var(--sub)"/><rect x="5" y="6" width="10" height="1.5" rx=".75" fill="var(--sub)"/><rect x="1" y="9.5" width="14" height="1.5" rx=".75" fill="var(--sub)"/><rect x="7" y="13" width="8" height="1.5" rx=".75" fill="var(--sub)"/></svg>
      </button>
    </div>
    <div class="tb-sep"></div>

    <!-- Listas — SVGs disponíveis no editor.html -->
    <div class="tb-group">
      <button class="fb" id="fb-ul" onclick="fmt('insertUnorderedList')">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M7,6H23a1,1,0,0,0,0-2H7A1,1,0,0,0,7,6Z" fill="var(--sub)"/><path d="M23,11H7a1,1,0,0,0,0,2H23a1,1,0,0,0,0-2Z" fill="var(--sub)"/><path d="M23,18H7a1,1,0,0,0,0,2H23a1,1,0,0,0,0-2Z" fill="var(--sub)"/><circle cx="2" cy="5" r="2" fill="var(--sub)"/><circle cx="2" cy="12" r="2" fill="var(--sub)"/><circle cx="2" cy="19" r="2" fill="var(--sub)"/></svg>
      </button>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// ════════════════════════════════════════════════
const CW = 794, CH = 1123;
let _z=1,_px=0,_py=0, _tool='select', _dtool='pen';
let _bsize=4, _dcolor='#FA6559';
let _sel=null, _hist=[], _redo=[], _eid=0;
let _drawing=false, _dctx=null;
let _curFont='Roboto',_curSize=16,_curColor='#111111',_curBg='#ffff00';
let _activeTouches=0,_zbt=null;

const WRAP   = ()=>document.getElementById('wrap');
const VP     = ()=>document.getElementById('viewport');
const CV     = ()=>document.getElementById('canvas');
const DC     = ()=>document.getElementById('draw-canvas');
const TOAST  =  document.getElementById('toast');

// ── Bridge ──────────────────────────────────────
function _bridge(o){ try{ if(window.flutter_inappwebview) window.flutter_inappwebview.callHandler('CvBridge',JSON.stringify(o)); }catch(e){} }

// ── Toast ───────────────────────────────────────
let _tt;
function showToast(m){ TOAST.textContent=m; TOAST.classList.add('show'); clearTimeout(_tt); _tt=setTimeout(()=>TOAST.classList.remove('show'),2100); }
window.showToast=showToast;

// ── Theme ───────────────────────────────────────
window.setTheme=d=>{ document.body.dataset.theme=d?'dark':'light'; };

// ════════════════════════════════════════════════
// VIEWPORT
// ════════════════════════════════════════════════
function applyT(sm){
  if(sm){VP().classList.add('smooth');setTimeout(()=>VP().classList.remove('smooth'),240);}
  VP().style.transform=`translate(${_px}px,${_py}px) scale(${_z})`;
  _zBadge();
}
function _zBadge(){const b=document.getElementById('zoom-badge');b.textContent=Math.round(_z*100)+'%';b.classList.add('show');clearTimeout(_zbt);_zbt=setTimeout(()=>b.classList.remove('show'),1600);}
function zoomStep(f){const wr=WRAP().getBoundingClientRect();zoomAt(_z*f,wr.left+wr.width/2,wr.top+wr.height/2);}
function zoomAt(nz,sx,sy){
  nz=Math.max(.06,Math.min(5,nz));
  _cacheWR();
  const cx=sx-_wrL,cy=sy-_wrT;
  _px=cx-(cx-_px)*nz/_z; _py=cy-(cy-_py)*nz/_z; _z=nz; applyT(false); _updCtx();
}
function fitScreen(sm){
  const wr=WRAP().getBoundingClientRect(),m=24;
  _z=Math.min((wr.width-m*2)/CW,(wr.height-m*2)/CH,1);
  _px=(wr.width-CW*_z)/2; _py=(wr.height-CH*_z)/2;
  applyT(!!sm);
}
let _wrL=0,_wrT=0;
function _cacheWR(){const r=WRAP().getBoundingClientRect();_wrL=r.left;_wrT=r.top;}
function s2c(sx,sy){return{x:(sx-_wrL-_px)/_z,y:(sy-_wrT-_py)/_z};}

// Wheel zoom
WRAP().addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.ctrlKey||e.metaKey) zoomAt(_z*(e.deltaY<0?1.09:.92),e.clientX,e.clientY);
  else{ _px-=e.deltaX; _py-=e.deltaY; applyT(false); _updCtx(); }
},{passive:false});

// Pinch
let _ts={},_pd=0;
WRAP().addEventListener('touchstart',e=>{_activeTouches=e.touches.length;[...e.changedTouches].forEach(t=>_ts[t.identifier]={x:t.clientX,y:t.clientY}); if(Object.keys(_ts).length===2)_pd=_pDist();},{passive:true});
WRAP().addEventListener('touchmove',e=>{
  if(e.touches.length<2)return; e.preventDefault();
  [...e.changedTouches].forEach(t=>_ts[t.identifier]={x:t.clientX,y:t.clientY});
  const p=Object.values(_ts); if(p.length<2)return;
  const d=_pDist(); if(!_pd){_pd=d;return;}
  const mid={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};
  zoomAt(_z*(d/_pd),mid.x,mid.y); _pd=d; _updCtx();
},{passive:false});
WRAP().addEventListener('touchend',e=>{_activeTouches=e.touches.length;[...e.changedTouches].forEach(t=>delete _ts[t.identifier]);_pd=0;},{passive:true});
function _pDist(){ const p=Object.values(_ts); return p.length<2?0:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); }

// Pan
let _panning=false,_ps={};
WRAP().addEventListener('pointerdown',e=>{
  if(_tool==='draw')return;
  if(e.target!==WRAP()&&e.target!==CV()&&e.target!==VP()&&e.target!==DC())return;
  _panning=true; _ps={x:e.clientX,y:e.clientY,px:_px,py:_py};
  WRAP().setPointerCapture(e.pointerId); WRAP().classList.add('panning');
});
WRAP().addEventListener('pointermove',e=>{ if(!_panning)return; _px=_ps.px+(e.clientX-_ps.x); _py=_ps.py+(e.clientY-_ps.y); applyT(false); _updCtx(); });
WRAP().addEventListener('pointerup',()=>{ _panning=false; WRAP().classList.remove('panning'); });
WRAP().addEventListener('click',e=>{
  if(e.target===WRAP()||e.target===CV()||e.target===VP()){
    if(_tool==='text'){ const p=s2c(e.clientX,e.clientY); mkTextEl(p.x,p.y); setTool('select'); return; }
    deselect();
  }
});

// ════════════════════════════════════════════════
// TOOL
// ════════════════════════════════════════════════
function setTool(t){
  _tool=t;
  WRAP().classList.toggle('tool-text',t==='text');
  WRAP().classList.toggle('tool-draw',t==='draw');
  DC().classList.toggle('active',t==='draw');
  document.getElementById('draw-cursor').style.display=t==='draw'?'block':'none';
  if(t!=='select')deselect();
}

// ─── Texto mode
function enterTextMode(){
  document.getElementById('main-tb').style.display='none';
  document.getElementById('txt-tb').classList.add('show');
  document.getElementById('btn-txt').classList.add('active');
  setTool('text'); showToast('Toque no canvas para inserir texto');
}
function exitTextMode(){
  document.getElementById('main-tb').style.display='flex';
  document.getElementById('txt-tb').classList.remove('show');
  document.getElementById('btn-txt').classList.remove('active');
  setTool('select');
}

// ─── Elements panel
function openElements(){ _bridge({action:'openElements'}); }
function closeElements(){}

// ─── Tools popup
const DRAW_C=['#FA6559','#0a84ff','#30d158','#ffd60a','#ff9f0a','#bf5af2','#1a1a1a','#ffffff'];

function toggleToolsPopup(){ _bridge({action:'openTools',tool:_dtool,brushSize:_bsize,color:_dcolor}); }


function setDrawTool(t){ _dtool=t; }
// called from Flutter
window.setDrawConfig=function(tool,size,color){
  _dtool=tool||_dtool;_bsize=size||_bsize;_dcolor=color||_dcolor;
  setTool('draw');_initDC();
  document.getElementById('btn-tools').classList.add('on');
  showToast({pen:'Caneta',brush:'Pincel',marker:'Marcador',eraser:'Borracha'}[_dtool]+' activo');
};
window.exitDrawMode=function(){ setTool('select'); document.getElementById('btn-tools').classList.remove('on'); };
function setBrushSize(v){ _bsize=v; }

// ════════════════════════════════════════════════
// DRAW CANVAS
// ════════════════════════════════════════════════
function _initDC(){
  const dc=DC();
  if(!_dctx||dc.width!==CW){ dc.width=CW; dc.height=CH; _dctx=dc.getContext('2d'); _dctx.imageSmoothingEnabled=true; }
}
DC().addEventListener('pointerdown',e=>{
  if(_tool!=='draw')return; e.preventDefault(); e.stopPropagation();
  _cacheWR();
  _drawing=true; DC().setPointerCapture(e.pointerId);
  const p=s2c(e.clientX,e.clientY);
  _dctx.beginPath(); _dctx.moveTo(p.x,p.y); _applyDS();
});
DC().addEventListener('pointermove',e=>{
  const cur=document.getElementById('draw-cursor');
  cur.style.left=e.clientX+'px'; cur.style.top=e.clientY+'px';
  const sz=_bsize*_z; cur.style.width=(sz*2)+'px'; cur.style.height=(sz*2)+'px';
  if(!_drawing)return; e.preventDefault();
  const p=s2c(e.clientX,e.clientY);
  if(_dtool==='eraser'){
    _dctx.globalCompositeOperation='destination-out';
    _dctx.lineWidth=_bsize*3; _dctx.lineTo(p.x,p.y); _dctx.stroke();
    _dctx.beginPath(); _dctx.moveTo(p.x,p.y);
  } else {
    _dctx.globalCompositeOperation='source-over'; _dctx.lineTo(p.x,p.y); _dctx.stroke();
  }
});
DC().addEventListener('pointerup',()=>{ if(!_drawing)return; _drawing=false; _dctx.closePath(); saveSnap(); });
function _applyDS(){
  _dctx.globalCompositeOperation='source-over';
  _dctx.strokeStyle=_dtool==='marker'?_dcolor+'99':_dcolor;
  _dctx.lineWidth=_dtool==='brush'?_bsize*2.5:_bsize;
  _dctx.lineCap='round'; _dctx.lineJoin='round';
  _dctx.globalAlpha=_dtool==='marker'?.65:1;
}
function clearDrawing(){ if(_dctx){_dctx.clearRect(0,0,CW,CH);saveSnap();showToast('Desenho limpo');} document.getElementById('tools-popup').classList.remove('open'); }

// ════════════════════════════════════════════════
// GALERIA
// ════════════════════════════════════════════════
function triggerGallery(){ _bridge({action:'insertImage'}); }
window.insertImageBase64=function(b64,mime){
  const img=new Image();
  img.onload=()=>{
    let w=img.naturalWidth,h=img.naturalHeight,mw=380,mh=280;
    if(w>mw){h=h*mw/w;w=mw;} if(h>mh){w=w*mh/h;h=mh;}
    const {x,y}=_ctr(w,h); mkImgEl(`data:${mime};base64,${b64}`,x,y,w,h);
  }; img.src=`data:${mime};base64,${b64}`;
};

// ════════════════════════════════════════════════
// SELECTION + HANDLES
// ════════════════════════════════════════════════
function deselect(){ if(_sel){_sel.classList.remove('selected');_rmH(_sel);_sel=null;} document.getElementById('ctx-tb').classList.remove('show'); }
function selectEl(el){ if(_sel===el){_updCtx();return;} deselect();_sel=el;el.classList.add('selected');_addH(el);_updCtx(); }
function _updCtx(){
  if(!_sel){document.getElementById('ctx-tb').classList.remove('show');return;}
  const tb=document.getElementById('ctx-tb'); tb.classList.add('show');
  const r=_sel.getBoundingClientRect(),tw=tb.offsetWidth||200;
  let left=r.left+r.width/2-tw/2,top=r.top-54;
  if(top<8)top=r.bottom+8; left=Math.max(8,Math.min(window.innerWidth-tw-8,left));
  tb.style.left=left+'px'; tb.style.top=top+'px';
  document.getElementById('lock-btn').querySelector('ion-icon').setAttribute('name',_sel.dataset.locked==='1'?'lock-closed-outline':'lock-open-outline');
}
const RH_DEF=[{c:'rh-tl',dx:0,dy:0},{c:'rh-tc',dx:.5,dy:0},{c:'rh-tr',dx:1,dy:0},{c:'rh-ml',dx:0,dy:.5},{c:'rh-mr',dx:1,dy:.5},{c:'rh-bl',dx:0,dy:1},{c:'rh-bc',dx:.5,dy:1},{c:'rh-br',dx:1,dy:1}];
function _rmH(el){ el.querySelectorAll('.rh,.rot-h,.rot-line').forEach(h=>h.remove()); }
function _addH(el){
  _rmH(el);
  RH_DEF.forEach(h=>{ const d=document.createElement('div'); d.className='rh '+h.c; _addResEv(d,el,h); el.appendChild(d); });
  const rl=document.createElement('div'); rl.className='rot-line'; el.appendChild(rl);
  const rh=document.createElement('div'); rh.className='rot-h'; rh.innerHTML='<ion-icon name="sync-outline"></ion-icon>'; _addRotEv(rh,el); el.appendChild(rh);
}
function _wireEl(el){
  if(el._wbPD)el.removeEventListener('pointerdown',el._wbPD);
  if(el._wbCL)el.removeEventListener('click',el._wbCL);
  if(el._wbDC)el.removeEventListener('dblclick',el._wbDC);
  const inn=el.querySelector('.wb-text');
  if(inn){ if(inn._wbBL)inn.removeEventListener('blur',inn._wbBL); if(inn._wbPD)inn.removeEventListener('pointerdown',inn._wbPD); }
  el._wbPD=e=>{
    if(e.target.classList.contains('rh')||e.target.classList.contains('rot-h'))return;
    if(el.dataset.locked==='1')return;
    if(el.querySelector('[contenteditable="true"]'))return;
    e.stopPropagation(); selectEl(el);
    _cacheWR();
    const p0=s2c(e.clientX,e.clientY),ox=p0.x-(parseFloat(el.style.left)||0),oy=p0.y-(parseFloat(el.style.top)||0);
    el.setPointerCapture(e.pointerId);
    const mv=ev=>{
      if(_activeTouches>1)return;
      const p=s2c(ev.clientX,ev.clientY); el.style.left=(p.x-ox)+'px'; el.style.top=(p.y-oy)+'px'; _updCtx();
    };
    const up=()=>{ el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); saveSnap(); };
    el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up);
  };
  el.addEventListener('pointerdown',el._wbPD);
  el._wbCL=e=>{ e.stopPropagation(); selectEl(el); }; el.addEventListener('click',el._wbCL);
  if(inn){
    el._wbDC=e=>{ e.stopPropagation(); _startEdit(inn); }; el.addEventListener('dblclick',el._wbDC);
    inn._wbBL=()=>_endEdit(inn); inn.addEventListener('blur',inn._wbBL);
    inn._wbPD=e=>{ if(inn.contentEditable==='true')e.stopPropagation(); }; inn.addEventListener('pointerdown',inn._wbPD);
  }
}
function _addResEv(h,el,hd){
  h.addEventListener('pointerdown',e=>{
    e.stopPropagation(); e.preventDefault(); h.setPointerCapture(e.pointerId);
    _cacheWR();
    const p0=s2c(e.clientX,e.clientY),sw=el.offsetWidth,sh=el.offsetHeight,sl=parseFloat(el.style.left)||0,st=parseFloat(el.style.top)||0;
    const mv=ev=>{ const p=s2c(ev.clientX,ev.clientY),dx=p.x-p0.x,dy=p.y-p0.y; let w=sw,ht=sh,l=sl,t=st;
      if(hd.dx===1)w=Math.max(30,sw+dx); else if(hd.dx===0){w=Math.max(30,sw-dx);l=sl+sw-w;}
      if(hd.dy===1)ht=Math.max(20,sh+dy); else if(hd.dy===0){ht=Math.max(20,sh-dy);t=st+sh-ht;}
      el.style.width=w+'px';el.style.height=ht+'px';el.style.left=l+'px';el.style.top=t+'px'; _updCtx(); };
    const up=()=>{ h.removeEventListener('pointermove',mv); h.removeEventListener('pointerup',up); saveSnap(); };
    h.addEventListener('pointermove',mv); h.addEventListener('pointerup',up);
  });
}
function _addRotEv(h,el){
  h.addEventListener('pointerdown',e=>{
    e.stopPropagation(); e.preventDefault(); h.setPointerCapture(e.pointerId);
    const mv=ev=>{ const r=el.getBoundingClientRect(),ang=Math.atan2(ev.clientY-(r.top+r.height/2),ev.clientX-(r.left+r.width/2))*180/Math.PI+90; el.style.transform=`rotate(${ang}deg)`; el.dataset.rot=ang; };
    const up=()=>{ h.removeEventListener('pointermove',mv); h.removeEventListener('pointerup',up); saveSnap(); };
    h.addEventListener('pointermove',mv); h.addEventListener('pointerup',up);
  });
}

// ════════════════════════════════════════════════
// ELEMENT FACTORY
// ════════════════════════════════════════════════
function _mxZ(){ let m=1; CV().querySelectorAll('.wb-el').forEach(e=>{const z=parseInt(e.style.zIndex)||0;if(z>m)m=z;}); return m; }
function _ctr(w,h){ return{x:CW/2-w/2,y:CH/2-h/2}; }
function _mk(type,x,y,w,h){
  const el=document.createElement('div'); el.className='wb-el'; el.dataset.type=type; el.dataset.id=++_eid;
  el.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:${_mxZ()+1}`;
  CV().insertBefore(el,DC()); _wireEl(el); return el;
}

// Texto simples
function mkTextEl(x,y,txt){
  const el=_mk('text',x-120,y-22,240,60);
  const inn=document.createElement('div'); inn.className='wb-text'; inn.contentEditable='false';
  inn.style.cssText='font-size:16px;color:#1a1a1a;font-family:Roboto,sans-serif;'; inn.textContent=txt||'Texto';
  el.appendChild(inn); _wireEl(el); selectEl(el); saveSnap();
  setTimeout(()=>{ inn.contentEditable='true'; inn.classList.add('editing'); inn.focus(); inn.textContent=''; },40);
}
function insertSimpleText(){ const{x,y}=_ctr(240,60); mkTextEl(x,y,'Texto'); }

// Caixa de texto
function insertTextBox(){
  const{x,y}=_ctr(280,110); const el=_mk('text',x,y,280,110);
  el.style.cssText+=';background:#f8f8f8;border-radius:8px;border:1.5px solid #e2e5eb;';

function saveSnap(){
  _hist.push(_snap()); if(_hist.length>50)_hist.shift(); _redo=[];
}
function doUndo(){ if(!_hist.length)return; _redo.push(_snap()); _applySnap(_hist.pop()); deselect(); showToast('Desfeito'); }

function _snap(){
  const els=Array.from(CV().querySelectorAll('.wb-el')).map(e=>{const c=e.cloneNode(true);c.querySelectorAll('.rh,.rot-h,.rot-line').forEach(h=>h.remove());return c.outerHTML;}).join('');
  const draw=_dctx?DC().toDataURL():'';

}

  CV().querySelectorAll('.wb-el').forEach(e=>e.remove());
  if(s.els){ const tmp=document.createElement('div'); tmp.innerHTML=s.els; Array.from(tmp.children).forEach(el=>{CV().insertBefore(el,DC());_wireEl(el);}); }
  if(s.draw&&_dctx){ const img=new Image(); img.onload=()=>{_dctx.clearRect(0,0,CW,CH);_dctx.drawImage(img,0,0);}; img.src=s.draw; }
}

window.addEventListener('keydown',e=>{
  if(_sel?.querySelector('[contenteditable="true"]'))return;
  if(e.key==='Delete'||e.key==='Backspace')delSelected();
  if(e.key==='Escape'){deselect();exitTextMode();}
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();doUndo();}
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.shiftKey&&e.key==='z'))){e.preventDefault();doRedo();}
  if((e.ctrlKey||e.metaKey)&&e.key==='d'){e.preventDefault();dupSelected();}
});

// EXPORT PDF
// ════════════════════════════════════════════════
async function exportPDF(){
  document.getElementById('pdf-loading').classList.add('show');
  try{
    deselect();await new Promise(r=>setTimeout(r,80));
    const canvas=await html2canvas(CV(),{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false,allowTaint:true});
    const{jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait',unit:'pt',format:'a4'});
    pdf.addImage(canvas.toDataURL('image/jpeg',.93),'JPEG',0,0,595.28,841.89);
    const b64=pdf.output('datauristring').split(',')[1];
    _bridge({action:'exportPDF',base64:b64});
  }catch(e){console.error(e);showToast('Erro ao gerar PDF');}
  finally{document.getElementById('pdf-loading').classList.remove('show');}
}

// ════════════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ════════════════════════════════════════════════
window.addEventListener('keydown',e=>{
  if(_sel?.querySelector('[contenteditable="true"]'))return;
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();delSelected();}
  if(e.key==='Escape'){deselect();exitTextMode();}
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();doUndo();}
  if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.shiftKey&&e.key==='z'))){e.preventDefault();doRedo();}
  if((e.ctrlKey||e.metaKey)&&e.key==='d'){e.preventDefault();dupSelected();}
  if((e.ctrlKey||e.metaKey)&&e.key==='0'){e.preventDefault();fitScreen(true);}
  if(_sel&&_sel.dataset.locked!=='1'&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
    e.preventDefault();
    const step=e.shiftKey?10:1,l=parseFloat(_sel.style.left)||0,t=parseFloat(_sel.style.top)||0;
    if(e.key==='ArrowLeft')_sel.style.left=(l-step)+'px';
    if(e.key==='ArrowRight')_sel.style.left=(l+step)+'px';
    if(e.key==='ArrowUp')_sel.style.top=(t-step)+'px';
    if(e.key==='ArrowDown')_sel.style.top=(t+step)+'px';
    _updCtx();
  }
});

// ════════════════════════════════════════════════
// CONTENT API
// ════════════════════════════════════════════════
window.getContent=function(){
  const els=Array.from(CV().querySelectorAll('.wb-el')).map(e=>{const c=e.cloneNode(true);c.querySelectorAll('.rh,.rot-h,.rot-line').forEach(h=>h.remove());return c.outerHTML;}).join('');
  const draw=_dctx?DC().toDataURL():'';
  return JSON.stringify({v:1,elements:els,drawing:draw});
};
window.loadContent=function(json){
  if(!json)return;
  try{
    const d=typeof json==='string'?JSON.parse(json):json;
    CV().querySelectorAll('.wb-el').forEach(e=>e.remove());
    if(d.elements){const tmp=document.createElement('div');tmp.innerHTML=d.elements;Array.from(tmp.children).forEach(el=>{CV().insertBefore(el,DC());_wireEl(el);});}
    if(d.drawing&&_dctx){const img=new Image();img.onload=()=>{_dctx.clearRect(0,0,CW,CH);_dctx.drawImage(img,0,0);};img.src=d.drawing;}
    showToast('Carregado');
  }catch(e){console.error(e);}
};

window.addEventListener('DOMContentLoaded',()=>{
  CV().style.width=CW+'px'; CV().style.height=CH+'px';
  DC().width=CW; DC().height=CH;
  DC().style.cssText=`position:absolute;top:0;left:0;width:${CW}px;height:${CH}px;border-radius:3px;pointer-events:none;`;
  _dctx=DC().getContext('2d');
  fitScreen(false);
  window.addEventListener('resize',()=>fitScreen(false));
  saveSnap();
});
