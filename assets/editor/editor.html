  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Lato:wght@400;700&family=Playfair+Display:wght@400;700&family=Babylonica&family=Agbalumo&family=Roboto:wght@400;700&family=Open+Sans:wght@400;700&family=Montserrat:wght@400;700&family=Oswald:wght@400;700&family=Raleway:wght@400;700&family=Nunito:wght@400;700&family=Poppins:wght@400;700&family=Ubuntu:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital,wght@0,400;0,700;1,400&family=Josefin+Sans:wght@400;700&family=Abril+Fatface&family=Pacifico&family=Dancing+Script:wght@400;700&family=Satisfy&family=Caveat:wght@400;700&family=Handlee&family=Lobster&family=Righteous&family=Quicksand:wght@400;700&family=Exo+2:wght@400;700&family=Orbitron:wght@400;700&family=Share+Tech+Mono&family=VT323&family=Press+Start+2P&family=Bangers&family=Fredoka:wght@400;700&family=Comfortaa:wght@400;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Spectral:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&family=Italiana&family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=DM+Serif+Display:ital@0;1&family=Cardo:ital,wght@0,400;1,400&family=Inter:wght@400;700&family=DM+Sans:wght@400;700&family=Work+Sans:wght@400;700&family=Fira+Sans:wght@400;700&family=Nunito+Sans:wght@400;700&family=Source+Sans+3:wght@400;700&family=Jost:wght@400;700&family=Plus+Jakarta+Sans:wght@400;700&family=Outfit:wght@400;700&family=Figtree:wght@400;700&family=DM+Mono:wght@400;500&family=Fira+Code:wght@400;700&family=JetBrains+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;700&family=Inconsolata:wght@400;700&family=Anonymous+Pro:wght@400;700&family=Anton&family=Bebas+Neue&family=Black+Han+Sans&family=Permanent+Marker&family=Sacramento&family=Great+Vibes&family=Kaushan+Script&family=Parisienne&display=swap" rel="stylesheet"/>

  <style>
    body[data-theme="dark"] {
      --acc:#ff6b9d; --acc-rgb:255,107,157; --acc-c:#000;
      --bg:#242424; --card:#363636; --border:#404040;
      --text:#e8e8e8; --sub:#8e8e93; --danger:#ff453a;
      --paper:#2e2e2e; --paper-text:#e0e0e0;
      --toolbar-bg:#363636; --toolbar-pill:#404040;
      --sheet:#242424; --sheet-txt:#e8e8e8;
    }
    :root, body[data-theme="light"] {
      --acc:#e0185e; --acc-rgb:224,24,94; --acc-c:#fff;
      --bg:#ffffff; --card:#ffffff; --border:#f0f0f0;
      --text:#111; --sub:#8e8e93; --danger:#ff3b30;
      --paper:#ffffff; --paper-text:#111;
      --toolbar-bg:#ffffff; --toolbar-pill:#f2f2f7;
      --sheet:#ffffff; --sheet-txt:#111111;
    }
    :root {
      --ion-font-family:'Syne',sans-serif;
      --ion-background-color:var(--bg);
      --ion-text-color:var(--text);
      --ion-color-primary:var(--acc);
      --ion-color-primary-rgb:var(--acc-rgb);
      --ion-color-primary-contrast:var(--acc-c);
      --ion-toolbar-background:var(--card);
    }

    *, *::before, *::after { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body, ion-app { height:100%; margin:0; }
    .acc { color:var(--acc); }

    ion-toolbar { --background:var(--card); --border-color:transparent; }
    ion-header  { border-bottom:1px solid var(--border); }
    ion-header::after { display:none !important; }
    ion-content { --background:var(--bg); }
    .app-title  { font-family:'Syne',sans-serif; font-weight:800; font-size:1.05rem; }

    .bar-btn {
      width:36px; height:36px; border:none; background:transparent;
      border-radius:50%; display:inline-flex; align-items:center;
      justify-content:center; cursor:pointer; color:var(--sub);
      transition:background .15s; padding:0;
    }
    .bar-btn:active { background:var(--toolbar-pill); }
    .bar-btn svg { pointer-events:none; }

    .fmt-bar {
      background:var(--toolbar-bg); border-bottom:1px solid var(--border);
      display:flex; align-items:center; height:48px; padding:0 10px;
      overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
      scrollbar-width:none; gap:2px;
    }
    .fmt-bar::-webkit-scrollbar { display:none; }

    .tb-group {
      display:flex; align-items:center; background:var(--toolbar-pill);
      border-radius:10px; padding:3px; gap:1px; flex-shrink:0;
    }
    .tb-sep { width:1px; height:22px; background:var(--border); flex-shrink:0; margin:0 5px; }

    .fb {
      width:32px; height:32px; border:none; background:transparent;
      border-radius:7px; display:inline-flex; align-items:center;
      justify-content:center; cursor:pointer; flex-shrink:0;
      color:var(--sub); transition:background .1s, color .1s; padding:0; line-height:1;
    }
    .fb svg { pointer-events:none; fill:var(--sub); transition:fill .1s; }
    .fb svg.stroke-icon { fill:none; stroke:currentColor; transition:stroke .1s; color:var(--sub); }
    .fb:active, .fb.on { background:rgba(var(--acc-rgb),.15); color:var(--acc); }
    .fb.on svg { fill:var(--acc); }
    .fb.on svg.stroke-icon { stroke:var(--acc); fill:none; color:var(--acc); }

    .tb-pill-btn {
      height:34px; border:none; background:var(--toolbar-pill);
      border-radius:10px; padding:0 22px 0 10px;
      display:inline-flex; align-items:center;
      cursor:pointer; flex-shrink:0; color:var(--text);
      font-family:'Syne',sans-serif; font-size:.75rem; font-weight:700;
      white-space:nowrap; position:relative;
    }
    .tb-pill-btn::after {
      content:''; position:absolute; right:7px; top:50%; transform:translateY(-50%);
      border-left:4px solid transparent; border-right:4px solid transparent;
      border-top:5px solid var(--sub); pointer-events:none;
    }
    .tb-pill-btn:active { opacity:.7; }

    /* Botão cor da fonte */
    .tb-color-btn {
      width:32px; height:32px; border:none; background:transparent;
      border-radius:7px; display:inline-flex; align-items:center;
      justify-content:center; cursor:pointer; flex-shrink:0; padding:0;
    }
    .tb-color-btn:active { background:rgba(var(--acc-rgb),.15); }
    .color-dot {
      width:18px; height:18px; border-radius:50%;
      border:2px solid rgba(0,0,0,.18); background:#111;
      pointer-events:none;
    }

    /* Modais e sheets — sem bordas arredondadas */
    ion-modal        { --border-radius: 0 !important; }
    ion-action-sheet { --border-radius: 0 !important; }

    /* Modal genérico — inner wrapper */
    .m-inner {
      padding: 0 0 48px;
      background: var(--card);
    }
    .m-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
    }
    .m-title {
      font-family:'Syne',sans-serif; font-weight:700; font-size:1rem;
      color:var(--text);
    }
    .m-cancel {
      font-family:'Syne',sans-serif; font-size:.85rem;
      color:var(--sub); background:none; border:none; padding:4px 0; cursor:pointer;
    }
    .m-list { list-style:none; margin:0; padding:0; }
    .m-item {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 20px; border-bottom:1px solid var(--border);
      cursor:pointer; gap:12px; min-height:56px;
      color:var(--text);
    }
    .m-item:active { background:rgba(128,128,128,.08); }
    .m-item-label { flex:1; color:var(--text); }
    .m-item-check {
      width:20px; height:20px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
    }
    .m-item-check svg { display:none; }
    .m-item.selected .m-item-check svg { display:block; }

    /* Modal de cor */
    .cm-inner { padding: 16px 20px 36px; }
    .color-grid {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 16px; margin: 0 0 20px;
    }
    .color-swatch {
      width:100%; aspect-ratio:1; border-radius:50%;
      border:3px solid transparent; cursor:pointer;
      transition:transform .12s, border-color .12s;
    }
    .color-swatch:active { transform:scale(.84); }
    .color-swatch.selected { border-color:var(--acc); }

    /* Color picker */
    .cp-canvas-wrap {
      position:relative; width:100%;
      overflow:hidden; cursor:crosshair; margin-bottom:14px;
      touch-action:none; user-select:none;
    }
    #cp-canvas, .cp-canvas-wrap canvas { width:100%; height:auto; display:block; touch-action:none; }
    .cp-cursor {
      position:absolute; width:18px; height:18px;
      border-radius:50%; border:2px solid #fff;
      box-shadow:0 0 0 1.5px rgba(0,0,0,.4);
      transform:translate(-50%,-50%); pointer-events:none;
    }
    .cp-slider-wrap {
      width:100%; height:20px;
      position:relative; cursor:pointer; margin-bottom:14px;
      touch-action:none;
    }
    #cp-hue-slider {
      background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
    }
    .cp-slider-thumb {
      position:absolute; top:50%; width:22px; height:22px;
      border-radius:50%; border:2px solid #fff;
      box-shadow:0 0 0 1.5px rgba(0,0,0,.4);
      transform:translate(-50%,-50%); pointer-events:none;
      background:#fff;
    }
    .cp-hex-row {
      display:flex; align-items:center; gap:10px; margin-bottom:20px;
    }
    .cp-preview {
      width:44px; height:44px; flex-shrink:0;
      border:1.5px solid var(--border);
    }
    .cp-hex-input {
      flex:1; height:44px;
      border:1.5px solid var(--border);
      padding:0 14px; font-family:'Space Mono',monospace; font-size:.85rem;
      background:var(--toolbar-pill); color:var(--text); outline:none;
    }
    .cp-hex-input:focus { border-color:var(--acc); }

    /* Documento */
    .doc-scroll {
      width:100%; height:100%; overflow-y:auto; overflow-x:auto;
      background:var(--bg); padding:20px 0 80px; -webkit-overflow-scrolling:touch;
    }
    .doc-pages { display:flex; flex-direction:column; align-items:center; gap:16px; }
    .page-wrap {
      width:794px; height:1123px; background:var(--paper);
      box-shadow:0 1px 6px rgba(0,0,0,.2), 0 4px 20px rgba(0,0,0,.12);
      position:relative; flex-shrink:0; padding:94px; overflow:hidden;
    }
    .page-editor {
      width:100%; height:100%; outline:none; border:none; background:transparent;
      font-family:Georgia,'Times New Roman',serif; font-size:16px; line-height:24px;
      color:var(--paper-text); overflow:hidden; resize:none;
      white-space:pre-wrap; word-break:break-word;
    }
    .page-editor:focus { outline:none; }
    .page-editor.empty::before { content:attr(data-ph); color:#bbb; font-style:italic; pointer-events:none; }
    .page-editor h1 { font-size:2em; font-family:'Syne',sans-serif; font-weight:800; margin:.4em 0 .2em; line-height:1.2; }
    .page-editor h2 { font-size:1.4em; font-family:'Syne',sans-serif; font-weight:700; margin:.4em 0 .2em; }
    .page-editor h3 { font-size:1.1em; font-family:'Syne',sans-serif; font-weight:600; margin:.4em 0 .15em; }
    .page-editor p  { margin:0 0 .4em; }
    .page-editor ul,.page-editor ol { padding-left:1.5em; margin:.3em 0; }
    .page-editor blockquote { border-left:3px solid var(--acc); margin:.5em 0; padding-left:.8em; color:#666; font-style:italic; }
    .page-num {
      position:absolute; bottom:36px; left:0; right:0; text-align:center;
      font-family:'Space Mono',monospace; font-size:9px; color:#bbb;
      letter-spacing:.05em; pointer-events:none;
    }
    .doc-meta {
      font-family:'Space Mono',monospace; font-size:.5rem;
      color:#aaa; text-align:center; padding:4px 0 0;
    }

    /* ── Views ── */
    .view {
      position:fixed; inset:0; display:none;
      flex-direction:column; background:var(--bg); overflow:hidden;
    }
    .view.active { display:flex; }
    #view-editor { z-index:10; }
    #view-editor.slide-in  { animation:slideIn  .3s cubic-bezier(.4,0,.2,1) both; }
    #view-editor.slide-out { animation:slideOut .25s cubic-bezier(.4,0,.2,1) both; }
    @keyframes slideIn  { from{transform:translateX(100%)} to{transform:translateX(0)} }
    @keyframes slideOut { from{transform:translateX(0)} to{transform:translateX(100%)} }

    /* Header nativo sem Ionic */
    .native-header {
      background:var(--bg); border-bottom:1px solid var(--border);
      padding: env(safe-area-inset-top,44px) 20px 14px;
      display:flex; align-items:flex-end; flex-shrink:0; min-height:60px;
      transition: background .3s ease;
    }
    .native-scroll {
      flex:1; overflow-y:auto; overflow-x:hidden;
      -webkit-overflow-scrolling:touch; padding-bottom:90px;
    }

    /* ── Tab bar ── */
    .app-tabbar {
      position:fixed; bottom:0; left:0; right:0; z-index:200;
      display:flex; background:var(--bg); border-top:1px solid var(--border);
      padding-bottom:env(safe-area-inset-bottom,0);
      transition: background .3s ease;
    }
    .tab-btn {
      flex:1; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:5px; padding:10px 0 14px;
      border:none; background:transparent; cursor:pointer; color:var(--sub);
      font-family:'Syne',sans-serif; font-size:.58rem; font-weight:800;
      letter-spacing:.06em; text-transform:uppercase; transition:color .15s;
    }
    .tab-btn svg { fill:var(--sub); transition:fill .15s; display:block; }
    .tab-btn.active { color:var(--acc); }
    .tab-btn.active svg { fill:var(--acc); }
    .tab-btn:active { opacity:.5; }

    /* ── HOME ── */
    .h-hero {
      padding:32px 24px 28px;
      border-bottom:1px solid var(--border);
    }
    .h-hero-pill {
      display:inline-flex; align-items:center;
      background:rgba(224,24,94,.1); color:var(--acc);
      font-family:'Syne',sans-serif; font-size:.62rem; font-weight:800;
      letter-spacing:.1em; text-transform:uppercase;
      padding:4px 12px; border-radius:99px; margin-bottom:16px;
    }
    .h-hero-title {
      font-family:'Syne',sans-serif; font-size:2.1rem; font-weight:800;
      color:var(--text); margin:0 0 10px; line-height:1.1;
    }
    .h-hero-sub {
      font-family:'Syne',sans-serif; font-size:.82rem;
      color:var(--sub); margin:0; font-weight:500;
    }
    .h-sect-row { padding:22px 20px 8px; }
    .h-sect-label {
      font-family:'Syne',sans-serif; font-size:.6rem; font-weight:800;
      letter-spacing:.14em; text-transform:uppercase; color:var(--sub);
    }
    .h-empty {
      display:flex; flex-direction:column; align-items:center;
      gap:14px; padding:32px 24px; text-align:center;
    }
    .h-empty-doc {
      width:58px; height:58px; border-radius:16px;
      background:rgba(224,24,94,.08);
      display:flex; align-items:center; justify-content:center;
    }
    .h-empty-msg {
      font-family:'Syne',sans-serif; font-size:.83rem;
      color:var(--sub); margin:0; line-height:1.65;
    }
    .h-empty-msg b { color:var(--acc); font-weight:800; cursor:pointer; }

    /* ── CRIAR ── */
    .c-item {
      display:flex; align-items:center; gap:16px; padding:18px 20px;
      background:var(--bg); border:none; cursor:pointer; width:100%;
      border-bottom:1px solid var(--border);
      -webkit-tap-highlight-color:transparent; transition:background .1s;
    }
    .c-item:active { background:var(--card); }
    .c-item--dim { opacity:.3; pointer-events:none; }
    .c-item-icon {
      width:46px; height:46px; border-radius:13px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
    }
    .c-item-icon--acc { background:rgba(224,24,94,.1); }
    .c-item-icon--muted { background:var(--toolbar-pill); }
    .c-item-info { flex:1; display:flex; flex-direction:column; gap:3px; text-align:left; }
    .c-item-title { font-family:'Syne',sans-serif; font-weight:700; font-size:.95rem; color:var(--text); }
    .c-item-sub { font-family:'Syne',sans-serif; font-size:.73rem; color:var(--sub); }

    /* ── Doc title editor ── */
    .doc-title-text {
      font-family:'Syne',sans-serif; font-weight:700; font-size:.95rem; color:var(--text);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Transições de tema suaves globais -->
  <style>
    body, .view, .native-header, .app-tabbar, ion-toolbar, ion-content,
    .fmt-bar, .doc-scroll, .m-inner, .m-header, .tb-pill-btn,
    .tb-group, .fb, .bar-btn {
      transition: background-color .3s ease, color .3s ease, border-color .3s ease;
    }

    /* ── Whiteboard ── */
    #view-whiteboard { z-index: 15; }
    .wb-canvas-wrap {
      flex: 1; position: relative; overflow: hidden;
      background: #fff; touch-action: none;
    }
    body[data-theme="dark"] .wb-canvas-wrap { background: #1a1a1a; }
    #wb-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .wb-toolbar {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 12px; background: var(--toolbar-bg);
      border-bottom: 1px solid var(--border); overflow-x: auto;
      scrollbar-width: none; flex-shrink: 0;
    }
    .wb-toolbar::-webkit-scrollbar { display: none; }
    .wb-btn {
      width: 36px; height: 36px; border: none; border-radius: 10px;
      background: var(--toolbar-pill); display: flex; align-items: center;
      justify-content: center; cursor: pointer; flex-shrink: 0;
      color: var(--sub); font-size: 16px; transition: background .1s;
    }
    .wb-btn.active { background: rgba(var(--acc-rgb),.2); color: var(--acc); }
    .wb-btn:active { opacity: .7; }
    .wb-color-swatch {
      width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent;
      cursor: pointer; flex-shrink: 0; transition: transform .1s;
    }
    .wb-color-swatch.active { border-color: var(--acc); transform: scale(1.2); }
    .wb-size-btn {
      height: 32px; padding: 0 12px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--toolbar-pill); color: var(--text);
      font-family: 'Syne', sans-serif; font-size: .75rem; font-weight: 700;
      cursor: pointer; flex-shrink: 0;
    }

    /* ── Resizable elements ── */
    .resizable-element .el-controls { display: none; }
  </style>
</head>
<body data-theme="light">
<ion-app>

       VIEW: EDITOR DE DOCUMENTOS
  ════════════════════════════════════════════ -->
  <div id="view-editor" class="view active">
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <button class="bar-btn" onclick="goHome()">

            </svg>
          </button>
        </ion-buttons>
        <ion-title>
          <span class="doc-title-text" id="doc-title-text" onclick="openRenameDialog()" style="cursor:pointer;" title="Clique para renomear">Sem título</span>

        <ion-buttons slot="end" style="gap:4px;padding-right:8px;">
          <button class="bar-btn" onclick="window.saveDocument()" title="Guardar" style="color:var(--acc);font-family:'Syne',sans-serif;font-size:.75rem;font-weight:800;width:auto;padding:0 6px;">Guardar</button>
          <button class="bar-btn" onclick="openGemini()">
            <svg viewBox="0 0 28 28" width="22" height="22">
              <defs>
                <linearGradient id="g-ai" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%"   stop-color="#4285f4"/>
                  <stop offset="45%"  stop-color="#9b72cb"/>
                  <stop offset="75%"  stop-color="#ea4335"/>
                  <stop offset="100%" stop-color="#fbbc04"/>
                </linearGradient>
              </defs>
              <path d="M14 2C14 8.627 8.627 14 2 14C8.627 14 14 19.373 14 26C14 19.373 19.373 14 26 14C19.373 14 14 8.627 14 2Z" fill="url(#g-ai)"/>

// ── Patch action sheet background ──
const _origCreate = document.createElement.bind(document);
document.createElement = function(tag) {
  const el = _origCreate(tag);
  if (tag === 'ion-action-sheet') {
    el.style.setProperty('--background',                  'var(--sheet)');
    el.style.setProperty('--button-background',           'var(--sheet)');
    el.style.setProperty('--button-background-activated', 'rgba(0,0,0,.06)');
    el.style.setProperty('--button-background-hover',     'rgba(0,0,0,.03)');
    el.style.setProperty('--button-color',                'var(--sheet-txt)');
    el.style.setProperty('--color',                       'var(--sheet-txt)');
    el.style.setProperty('--border-radius',               '0');
  }
  return el;
};

// ── Navegação ──
let _currentView = 'home';

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + id).classList.add('active');
  _currentView = id;
  // tabs
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const tab = document.getElementById('tab-' + id);
  if (tab) tab.classList.add('active');
}

function goHome() {
  // InAppWebView (nativo) — usa callHandler
  if (window.flutter_inappwebview) {
    window.flutter_inappwebview.callHandler('FlutterBridge', JSON.stringify({ action: 'back' }));
  } else if (window.parent && window.parent !== window) {
    // iframe web
    window.parent.postMessage({ action: 'back' }, '*');
  } else {
    history.back();
  }
}

function goCriar() { showView('criar'); }

function openDocEditor() {
  document.getElementById('doc-pages').innerHTML = '';
  pages = []; activePg = 0;
  // slide in do editor
  const editor = document.getElementById('view-editor');
  editor.classList.add('active','slide-in');
  document.querySelectorAll('.view:not(#view-editor)').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  editor.addEventListener('animationend', () => {
    editor.classList.remove('slide-in');
  }, { once:true });
  _currentView = 'criar'; // voltar para criar ao fechar
  setTimeout(() => {
    createPage(0); applyScale(); updateMeta();
    pages[0]?.editor?.focus();
  }, 320);
}

function getScale() { return (window.innerWidth - 24) / PAGE_W; }
function applyScale() {
  const s = getScale();
  document.querySelectorAll('.page-wrap').forEach(p => {
    p.style.transformOrigin = 'top center';
    p.style.transform       = `scale(${s})`;
    p.style.marginBottom    = `${(PAGE_H * s) - PAGE_H}px`;
  });
  document.getElementById('doc-pages').style.gap = `${16 / s}px`;
}

// ── Páginas ──
function createPage(idx) {
  const wrap = document.createElement('div');
  wrap.className = 'page-wrap';
  const ed = document.createElement('div');
  ed.className       = 'page-editor empty';
  ed.contentEditable = 'true';
  ed.setAttribute('data-ph', idx === 0 ? 'Comece a escrever…' : '');
  ed.setAttribute('data-page', String(idx));
  ed.addEventListener('input',   () => onInput(idx));
  ed.addEventListener('keydown', onKey);
  ed.addEventListener('mouseup', updateStates);
  ed.addEventListener('keyup',   updateStates);
  ed.addEventListener('focus',   () => { activePg = idx; });
  ed.addEventListener('input',   () => ed.classList.toggle('empty', ed.innerText.trim() === ''));
  const num = document.createElement('div');
  num.className = 'page-num';
  num.textContent = String(idx + 1);
  wrap.appendChild(ed); wrap.appendChild(num);
  document.getElementById('doc-pages').appendChild(wrap);
  const s = getScale();
  wrap.style.transformOrigin = 'top center';
  wrap.style.transform       = `scale(${s})`;
  wrap.style.marginBottom    = `${(PAGE_H * s) - PAGE_H}px`;
  pages.push({ wrap, editor: ed });
  return ed;
}
// ── Overflow ──
let _raf = false;
function onInput(idx) {
  updateMeta(); updateStates();
  if (_raf) return; _raf = true;
  requestAnimationFrame(() => { _raf = false; reflow(idx); });
}
function reflow(startIdx) {
  for (let i = startIdx; i < pages.length; i++) {
    const ed = pages[i].editor;
    if (ed.scrollHeight <= CONTENT_H) break;
    if (i + 1 >= pages.length) { createPage(pages.length); applyScale(); }
    const next = pages[i + 1].editor;
    let n = 0;
    while (ed.scrollHeight > CONTENT_H && ed.lastChild && n++ < 200)
      next.insertBefore(ed.lastChild, next.firstChild);
  }
  for (let i = pages.length - 2; i >= startIdx; i--) {
    const ed = pages[i].editor, next = pages[i + 1].editor;
    while (next.firstChild) {
      const node = next.firstChild; next.removeChild(node); ed.appendChild(node);
      if (ed.scrollHeight > CONTENT_H) { ed.removeChild(node); next.insertBefore(node, next.firstChild); break; }
    }
  }
  for (let i = pages.length - 1; i >= 1; i--) {
    const ed = pages[i].editor;
    if (!ed.childNodes.length && !ed.innerText.trim()) { pages[i].wrap.remove(); pages.splice(i, 1); }
    else break;
  }
  renumber(); updateMeta();
}
function renumber() {
  pages.forEach((p, i) => {
    const n = p.wrap.querySelector('.page-num');
    if (n) n.textContent = String(i + 1);
    p.editor.setAttribute('data-page', String(i));
  });
}
function updateMeta() {
  const t = pages.map(p => p.editor.innerText).join(' ').trim();
  const w = t ? t.split(/\s+/).filter(Boolean).length : 0;
  document.getElementById('doc-meta').textContent =
    `${w} palavra${w!==1?'s':''} · ${t.length} car. · ${pages.length} pág.`;
}
function getActiveEditor() { return pages[activePg]?.editor || pages[0].editor; }
function fmt(cmd) { getActiveEditor().focus(); document.execCommand(cmd, false, null); updateStates(); }
function fmtAlign(cmd) {
  fmt(cmd);
  ['btn-jl','btn-jc','btn-jr','btn-jf'].forEach(id => document.getElementById(id)?.classList.remove('on'));
  const map = {justifyLeft:'btn-jl',justifyCenter:'btn-jc',justifyRight:'btn-jr',justifyFull:'btn-jf'};
  if (map[cmd]) document.getElementById(map[cmd])?.classList.add('on');
}
function updateStates() {
  ['b','i','u','s','ul','ol','sup','sub'].forEach(k => {
    const cmd = {b:'bold',i:'italic',u:'underline',s:'strikeThrough',ul:'insertUnorderedList',ol:'insertOrderedList',sup:'superscript',sub:'subscript'}[k];
    document.getElementById('btn-'+k)?.classList.toggle('on', document.queryCommandState(cmd));
  });
}

function hslToHex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(255*c).toString(16).padStart(2,'0')};return'#'+f(0)+f(8)+f(4)}
function hexToHsl(hex){let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max===min){h=s=0}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break}}return[Math.round(h*360),Math.round(s*100),Math.round(l*100)]}

async function exportPDF() {
  showToast('A gerar PDF…');
  setProgress(true);

  // Aguardar bibliotecas carregarem
  let attempts = 0;
  while ((typeof window.jspdf === 'undefined') && attempts < 20) {
    await new Promise(r => setTimeout(r, 200));
    attempts++;
  }

  if (typeof window.jspdf === 'undefined') {
    setProgress(false);
    showToast('Biblioteca PDF não carregou. A usar fallback HTML…');
    // Fallback: envia HTML para o Flutter converter
    const html = _buildFullHtmlExport();
    _sendFlutter({ action: 'exportPDF_html', html, title: window._docTitle || 'documento' });
    return;
  }

  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'px', format: [794, 1123], orientation: 'portrait', hotfixes: ['px_scaling'] });

    // Modo template: captura iframe
    if (_isTemplateMode) {
      const iframe = document.getElementById('template-iframe');
      if (iframe) {
        const wrap = iframe.parentElement;
        const origTransform = wrap.style.transform;
        wrap.style.transform = 'none';
        
        const canvas = await html2canvas(iframe.contentDocument.body, {
          scale: 2, useCORS: true, logging: false,
          backgroundColor: '#ffffff',
          allowTaint: true,
        });
        wrap.style.transform = origTransform;
        
        const w = canvas.width / 2;
        const h = canvas.height / 2;
        const pdfH = (h / w) * 794;
        const pdfDoc = new jsPDF({ unit: 'px', format: [794, pdfH], orientation: 'portrait' });
        const imgData = canvas.toDataURL('image/jpeg', 0.95);
        pdfDoc.addImage(imgData, 'JPEG', 0, 0, 794, pdfH);
        const base64 = pdfDoc.output('datauristring').split(',')[1];
        setProgress(false);
        _sendFlutter({ action: 'exportPDF', base64, title: window._docTitle || 'documento' });
        showToast('PDF gerado!');
        return;
      }
    }

    // Modo normal: uma página de cada vez
    for (let i = 0; i < pages.length; i++) {
      const wrap = pages[i].wrap;
      const origTransform = wrap.style.transform;
      const origMargin    = wrap.style.marginBottom;
      const origW         = wrap.style.width;
      const origH         = wrap.style.height;

      wrap.style.transform    = 'none';
      wrap.style.marginBottom = '0';
      wrap.style.width        = '794px';
      wrap.style.height       = '1123px';

      const origBg = wrap.style.background;
      wrap.style.background = '#ffffff';
      const ed = pages[i].editor;
      const origColor = ed.style.color;
      ed.style.color = '#111111';

      const canvas = await html2canvas(wrap, {
        scale: 2, useCORS: true, logging: false,
        backgroundColor: '#ffffff',
        width: 794, height: 1123,
        windowWidth: 794, windowHeight: 1123,
      });

      wrap.style.transform    = origTransform;
      wrap.style.marginBottom = origMargin;
      wrap.style.width        = origW;
      wrap.style.height       = origH;
      wrap.style.background   = origBg;
      ed.style.color          = origColor;

      if (i > 0) pdf.addPage([794, 1123], 'portrait');
      const imgData = canvas.toDataURL('image/jpeg', 0.92);
      pdf.addImage(imgData, 'JPEG', 0, 0, 794, 1123);
    }

    applyScale();
    const base64 = pdf.output('datauristring').split(',')[1];
    setProgress(false);
    _sendFlutter({ action: 'exportPDF', base64, title: window._docTitle || 'documento' });
    showToast('PDF gerado! ✓');
  } catch(err) {
    setProgress(false);
    applyScale();
    console.error('exportPDF error:', err);
    // Fallback HTML
    const html = _buildFullHtmlExport();
    _sendFlutter({ action: 'exportPDF_html', html, title: window._docTitle || 'documento' });
    showToast('PDF gerado via fallback');
  }
}

function _buildFullHtmlExport() {
  if (_isTemplateMode) {
    const iframe = document.getElementById('template-iframe');
    if (iframe) {
      try { return iframe.contentDocument.documentElement.outerHTML; } catch(e) {}
    }
    return pages.map(p => p.editor.innerHTML).join('');
  }
  const body = pages.map(p => `<div class="page" style="page-break-after:always;padding:94px;width:794px;min-height:1123px;box-sizing:border-box;background:#fff;font-family:Georgia,serif;line-height:1.65;">${p.editor.innerHTML}</div>`).join('');
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${window._docTitle}</title><style>body{margin:0;background:#fff;}@media print{.page{page-break-after:always;}}</style></head><body>${body}</body></html>`;
}

  } else {
    // Inserir na posição do cursor
    document.execCommand('insertHTML', false, 
      data.text.trim().startsWith('<') ? data.text : '<p>' + data.text.replace(/

/g, '</p><p>').replace(/
/g, '<br>') + '</p>'

  } else if (type === 'insert') {
    if (data.action === 'hr')          document.execCommand('insertHorizontalRule',false,null);
    else if (data.action === 'blockquote') document.execCommand('formatBlock',false,'blockquote');
    else if (data.action === 'code')   insertCode();

    else if (data.action === 'ol')     fmt('insertOrderedList');
    else if (data.action === 'pageBreak') document.execCommand('insertHTML',false,'<div style="page-break-after:always;height:0;"></div>');
    else if (data.action === 'table')  _sendFlutter({ action:'modal', type:'table' });
    else if (data.action === 'link')   _sendFlutter({ action:'modal', type:'link', text:(window.getSelection()?.toString()||'') });

  } else if (type === 'imageUpload') {

      const src = `data:${data.mime};base64,${data.base64}`;
      _insertResizableImage(src, data.alt || 'imagem');

  } else if (type === 'qrcode') {
    if (data.content) _insertQrCode(data.content);

  } else if (type === 'opcoes') {
    if (data.action === 'exportPDF')       exportPDF();
    else if (data.action === 'exportTXT')  exportTXT();
    else if (data.action === 'sharePDF')   sharePDF();
    else if (data.action === 'stats')      showDocStats();
    else if (data.action === 'findReplace')window.openFindReplace();
    else if (data.action === 'print')      window.print();
    else if (data.action === 'duplicate')  duplicatePage();
    else if (data.action === 'newPage')    addPageManual();
    else if (data.action === 'whitePaper') toggleWhitePaper();
    else if (data.action === 'clearAll')   clearAll();
    else if (data.action === 'whiteboard') window.openWhiteboard();

  } else if (type === 'gemini') {
    if (data.action) aiRun(data.action);

  } else if (type === 'layout') {
    if (data.format) {
      const formats = { A4:{w:794,h:1123}, A5:{w:559,h:794}, Letter:{w:816,h:1056}, Legal:{w:816,h:1344} };
      const f = formats[data.format];
      if (f) { document.querySelectorAll('.page-wrap').forEach(p=>{ p.style.width=f.w+'px'; p.style.height=f.h+'px'; }); applyScale(); }

      document.querySelectorAll('.page-editor').forEach(p=>{ p.style.lineHeight=data.spacing; });
    }

  } else if (type === 'findReplace') {
    if (data.action === 'replace' && data.find) {
      const re = new RegExp(data.find.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
      let n = 0;
      pages.forEach(p=>{ p.editor.innerHTML = p.editor.innerHTML.replace(re, ()=>{ n++; return data.replaceWith||''; }); });
      updateMeta();
      showToast(`${n} substituição(ões) efectuada(s)`);

  } else if (type === 'rename') {
    if (data.title) {
      window._docTitle = data.title;

      if (el) el.textContent = data.title;

// ── Alterar tema (chamado pelo Flutter quando o utilizador muda tema) ──

// ── Carregar DOCX via mammoth.js (base64) ──
window.loadDocxBase64 = function(b64Str) {
  try {
    // Converter base64 para ArrayBuffer
    const binaryStr  = atob(b64Str);
    const bytes      = new Uint8Array(binaryStr.length);
    for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
    const buffer = bytes.buffer;

    mammoth.convertToHtml({ arrayBuffer: buffer })
      .then(result => {
        const html = result.value || '<p>Documento vazio</p>';
        document.getElementById('doc-pages').innerHTML = '';
        pages = []; activePg = 0;
        createPage(0); applyScale(); updateMeta();

        // Dividir HTML por páginas de forma heurística
        const div = document.createElement('div');
        div.innerHTML = html;
        const children = Array.from(div.children);

        let pageIdx = 0;
        let charCount = 0;
        const CHARS_PER_PAGE = 1800;

        children.forEach(child => {
          if (pageIdx >= pages.length) createPage(pageIdx);
          pages[pageIdx].editor.appendChild(child.cloneNode(true));
          charCount += (child.textContent || '').length;
          if (charCount >= CHARS_PER_PAGE) {
            pageIdx++;
            charCount = 0;
            createPage(pageIdx);
            applyScale();
          }
        });

        updateMeta();
        showToast('DOCX carregado!');
      })
      .catch(err => {
        showToast('Erro ao converter DOCX');
        console.error(err);
      });
  } catch(e) {
    showToast('Erro ao carregar DOCX');
    console.error(e);
  }
};

// ── Extrair body de HTML completo ──────────────────────────────
function _extractBodyHtml(raw) {
  if (!raw || typeof raw !== 'string') return '';
  const trimmed = raw.trim();
  return trimmed; // Retorna o HTML completo para preservar estilos
}

// Verifica se o HTML é um template completo (com DOCTYPE/html/style)
function _isFullHtmlTemplate(raw) {
  if (!raw || typeof raw !== 'string') return false;
  const t = raw.trim();
  return /^<!DOCTYPE|^<html/i.test(t) || (/<style[\s\S]*?>[\s\S]*?<\/style>/i.test(t) && /<body/i.test(t));
}

// Extrai apenas o body para edição normal
function _extractBodyOnly(raw) {
  if (!raw || typeof raw !== 'string') return '';
  const trimmed = raw.trim();
  if (/^<!DOCTYPE|^<html/i.test(trimmed)) {
    const m = trimmed.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
    if (m) return m[1].trim();
    const idx = trimmed.toLowerCase().indexOf('<body');
    if (idx >= 0) {
      const after = trimmed.slice(trimmed.indexOf('>', idx) + 1);
      const end = after.toLowerCase().lastIndexOf('</body>');
      return end >= 0 ? after.slice(0, end).trim() : after.trim();
    }
  }
  return trimmed;
}

// ── Dividir HTML em páginas por PAGE_BREAK ─────────────────────
let _isTemplateMode = false; // true quando exibe template HTML completo

function _splitIntoPages(rawHtml, id, title, isNew) {
  document.getElementById('doc-pages').innerHTML = '';
  pages = []; activePg = 0;
  window._docId    = id    || null;
  window._docTitle = title || 'Sem título';
  const titleEl = document.getElementById('doc-title-text');
  if (titleEl) titleEl.textContent = window._docTitle;

  if (!rawHtml || !rawHtml.trim()) {
    _isTemplateMode = false;
    createPage(0); applyScale(); updateMeta();
    if (isNew) setTimeout(() => pages[0]?.editor?.focus(), 300);
    return;
  }

  // ── Modo template: HTML completo com estilos próprios ──────────
  if (_isFullHtmlTemplate(rawHtml) && !rawHtml.includes('<!-- PAGE_BREAK -->')) {
    _isTemplateMode = true;
    _renderTemplateHtml(rawHtml);
    return;
  }

  // ── Modo normal: edição por páginas ────────────────────────────
  _isTemplateMode = false;
  const bodyHtml = _extractBodyOnly(rawHtml);
  const parts = bodyHtml.split('<!-- PAGE_BREAK -->').filter(p => p.trim());

  if (parts.length === 0) {
    createPage(0); applyScale(); updateMeta();
    return;
  }

  parts.forEach((part, i) => {
    createPage(i);
    if (pages[i]) {
      pages[i].editor.innerHTML = part.trim();
      if (part.trim()) pages[i].editor.classList.remove('empty');
    }
  });

  applyScale();
  updateMeta();

  // Sem placeholder em docs existentes
  if (!isNew) {
    pages.forEach(p => {
      p.editor.classList.remove('empty');
      p.editor.setAttribute('data-ph', '');
    });
  }
}

// ── Renderiza template HTML completo em iframe isolado ──────────
function _renderTemplateHtml(html) {
  const docPages = document.getElementById('doc-pages');
  docPages.innerHTML = '';
  pages = []; activePg = 0;

  // Container do iframe com aspeto de papel A4
  const wrap = document.createElement('div');
  wrap.className = 'page-wrap template-iframe-wrap';
  wrap.style.cssText = 'height:auto;min-height:1123px;overflow:visible;padding:0;';

  const iframe = document.createElement('iframe');
  iframe.id = 'template-iframe';
  iframe.style.cssText = 'width:794px;border:none;display:block;background:#fff;';
  iframe.setAttribute('scrolling', 'no');
  wrap.appendChild(iframe);
  docPages.appendChild(wrap);

  // Escreve HTML no iframe
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(html);
  doc.close();

  // Ajusta altura do iframe ao conteúdo
  function resizeIframe() {
    try {
      const h = doc.body ? Math.max(doc.body.scrollHeight, 1123) : 1123;
      iframe.style.height = h + 'px';
      wrap.style.height = h + 'px';
    } catch(e) {}
  }
  setTimeout(resizeIframe, 200);
  setTimeout(resizeIframe, 600);

  // Cria uma página "virtual" para guardar/exportar
  const fakeEd = document.createElement('div');
  fakeEd.className = 'page-editor';
  fakeEd.innerHTML = html;
  fakeEd.style.display = 'none';
  wrap.appendChild(fakeEd);
  pages.push({ wrap, editor: fakeEd });

  // Aplica escala
  const s = getScale();
  wrap.style.transformOrigin = 'top center';
  wrap.style.transform = `scale(${s})`;
  wrap.style.marginBottom = `${(1123 * s) - 1123}px`;

  updateMeta();
  showToast('Template carregado ✓');
}

// ── loadContent — chamado pelo Flutter (nova API) ─────────────
// Assinatura: loadContent(html, title, id, isNew)
window.loadContent = function(rawHtml, title, id, isNew) {
  // Usar setTimeout para não bloquear thread UI ao carregar templates grandes
  setTimeout(() => {
    const bodyHtml = _extractBodyHtml(rawHtml);
    // Extrair estilos do HTML e injectá-los no head sem bloquear
    if (rawHtml && /<!DOCTYPE|<html/i.test(rawHtml.trim())) {
      const styleMatches = rawHtml.match(/<style[^>]*>([\s\S]*?)<\/style>/gi) || [];
      styleMatches.forEach(styleBlock => {
        const existing = document.getElementById('tpl-styles');
        if (existing) existing.remove();
        const styleEl = document.createElement('style');
        styleEl.id = 'tpl-styles';
        styleEl.textContent = styleBlock.replace(/<\/?style[^>]*>/gi, '');
        document.head.appendChild(styleEl);
      });
    }
    _splitIntoPages(bodyHtml, id, title, isNew);
  }, 10);
};

// ── loadDocument — chamado internamente / iframe web ──────────
// Assinatura original: loadDocument(id, title, htmlContent)
window.loadDocument = function(id, title, htmlContent) {
  const bodyHtml = _extractBodyHtml(htmlContent);
  _splitIntoPages(bodyHtml, id, title, !htmlContent || !htmlContent.trim());
};

// Actualizar título — chamado pelo Flutter
window.setDocTitle = function(t) {
  window._docTitle = t;
  const el = document.getElementById('doc-title-text');

};

// Obter conteúdo — para uso interno
window.getDocumentContent = function() {
  const html = pages.map(p => p.editor.innerHTML).join('<!-- PAGE_BREAK -->');
  const text = pages.map(p => p.editor.innerText).join('\n\n').trim();

};

// Bridge bidirecional Web ↔ iframe
window.addEventListener('message', function(e) {

  if (!d || typeof d !== 'object') return;
  if (d.action === 'load') {
    window.loadDocument(d.id, d.title, d.html || '');

}

// ═══════════════════════════════════════════════════════
// ── ASSINATURA (canvas) ─────────────────────────────────
// ═══════════════════════════════════════════════════════
function _openSignaturePad() {
  const existing = document.getElementById('sig-modal');
  if (existing) existing.remove();

  const modal = document.createElement('div');
  modal.id = 'sig-modal';
  modal.style.cssText = `
    position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;
    display:flex;align-items:flex-end;justify-content:center;`;
  modal.innerHTML = `
    <div style="background:var(--card);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:500px;">
      <div style="text-align:center;margin-bottom:12px;font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;color:var(--text);">Desenha a assinatura</div>
      <canvas id="sig-canvas" width="400" height="160"
        style="width:100%;border:1.5px solid var(--border);border-radius:12px;touch-action:none;background:#fff;display:block;"></canvas>
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button onclick="clearSig()" style="flex:1;padding:14px;border:1.5px solid var(--border);border-radius:999px;background:none;color:var(--text);font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;">Limpar</button>
        <button onclick="cancelSig()" style="flex:1;padding:14px;border:1.5px solid var(--border);border-radius:999px;background:none;color:var(--sub);font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;">Cancelar</button>
        <button onclick="saveSig()" style="flex:2;padding:14px;border:none;border-radius:999px;background:var(--acc);color:#fff;font-family:'Syne',sans-serif;font-weight:800;cursor:pointer;">Inserir</button>
      </div>
    </div>`;
  document.body.appendChild(modal);

  const canvas = document.getElementById('sig-canvas');
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  let drawing = false, lx = 0, ly = 0;

  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - r.left) * (canvas.width / r.width), y: (src.clientY - r.top) * (canvas.height / r.height) };
  }
  canvas.addEventListener('mousedown',  e => { drawing=true; const p=getPos(e); lx=p.x; ly=p.y; });
  canvas.addEventListener('mousemove',  e => { if(!drawing) return; const p=getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke(); lx=p.x; ly=p.y; });
  canvas.addEventListener('mouseup',    () => drawing=false);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); drawing=true; const p=getPos(e); lx=p.x; ly=p.y; }, {passive:false});
  canvas.addEventListener('touchmove',  e => { e.preventDefault(); if(!drawing) return; const p=getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke(); lx=p.x; ly=p.y; }, {passive:false});
  canvas.addEventListener('touchend',   () => drawing=false);

  window.clearSig  = () => { ctx.clearRect(0,0,canvas.width,canvas.height); };
  window.cancelSig = () => modal.remove();
  window.saveSig   = () => {
    const src = canvas.toDataURL('image/png');
    modal.remove();
    _insertResizableImage(src, 'Assinatura');
    showToast('Assinatura inserida ✓');
  };
}


// ═══════════════════════════════════════════════════════
// ── WHITEBOARD ─────────────────────────────────────────
// ═══════════════════════════════════════════════════════
(function() {
  let canvas, ctx, wrap;
  let tool = 'pen', color = '#111111', size = 3;
  let drawing = false, startX = 0, startY = 0;
  let history = [], redoStack = [];
  let snapshot = null;
  let textMode = false;

  window.wb_init = function() {
    wrap  = document.getElementById('wb-wrap');
    canvas= document.getElementById('wb-canvas');
    if (!canvas || !wrap) return;
    ctx   = canvas.getContext('2d');
    _resize();
    window.addEventListener('resize', _resize);

    // Events
    canvas.addEventListener('mousedown',  _start, {passive:false});
    canvas.addEventListener('mousemove',  _move,  {passive:false});
    canvas.addEventListener('mouseup',    _end);
    canvas.addEventListener('mouseleave', _end);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); _start(_toMouse(e)); }, {passive:false});
    canvas.addEventListener('touchmove',  e => { e.preventDefault(); _move(_toMouse(e));  }, {passive:false});
    canvas.addEventListener('touchend',   e => _end());
  };

  function _resize() {
    if (!canvas || !wrap) return;
    const w = wrap.clientWidth, h = wrap.clientHeight;
    const img = ctx ? ctx.getImageData(0, 0, canvas.width, canvas.height) : null;
    canvas.width = w; canvas.height = h;
    if (img) ctx.putImageData(img, 0, 0);
  }

  function _toMouse(e) {
    const t = e.touches[0];
    return { clientX: t.clientX, clientY: t.clientY, type: e.type.replace('touch','mouse') };
  }

  function _pos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function _saveHistory() {
    history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    if (history.length > 50) history.shift();
    redoStack = [];
  }

  function _start(e) {
    if (tool === 'text') { _addText(e); return; }
    drawing = true;
    const p = _pos(e);
    startX = p.x; startY = p.y;
    _saveHistory();
    snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);

    ctx.beginPath();
    ctx.strokeStyle = tool === 'eraser' ? (document.body.dataset.theme === 'dark' ? '#1a1a1a' : '#ffffff') : color;
    ctx.lineWidth   = tool === 'eraser' ? size * 3 : (tool === 'marker' ? size * 2 : size);
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    ctx.globalAlpha = tool === 'marker' ? 0.4 : 1;
    ctx.moveTo(startX, startY);
  }

  function _move(e) {
    if (!drawing) return;
    const p = _pos(e);

    if (tool === 'pen' || tool === 'eraser' || tool === 'marker') {
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else {
      // Formas: restaurar snapshot e redesenhar
      ctx.putImageData(snapshot, 0, 0);
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.fillStyle   = color + '22';
      ctx.lineWidth   = size;
      ctx.globalAlpha = 1;
      if (tool === 'line') {
        ctx.moveTo(startX, startY); ctx.lineTo(p.x, p.y); ctx.stroke();
      } else if (tool === 'rect') {
        ctx.strokeRect(startX, startY, p.x - startX, p.y - startY);
        ctx.fillRect(startX, startY, p.x - startX, p.y - startY);
      } else if (tool === 'circle') {
        const rx = Math.abs(p.x - startX) / 2, ry = Math.abs(p.y - startY) / 2;
        const cx = startX + (p.x - startX) / 2, cy = startY + (p.y - startY) / 2;
        ctx.ellipse(cx, cy, rx, ry, 0, 0, 2 * Math.PI);
        ctx.stroke(); ctx.fill();
      }
    }
  }

  function _end() {
    if (!drawing) return;
    drawing = false;
    ctx.globalAlpha = 1;
    ctx.closePath();
  }

  function _addText(e) {
    const p = _pos(e);
    const input = document.createElement('input');
    input.style.cssText = `
      position:fixed;left:${e.clientX}px;top:${e.clientY}px;
      font-size:${size * 4 + 12}px;color:${color};background:transparent;
      border:none;outline:1px dashed ${color};font-family:'Syne',sans-serif;
      z-index:9999;min-width:80px;`;
    document.body.appendChild(input);
    input.focus();
    input.addEventListener('blur', () => {
      if (input.value.trim()) {
        _saveHistory();
        ctx.font = `${size * 4 + 12}px Syne, sans-serif`;
        ctx.fillStyle = color;
        ctx.globalAlpha = 1;
        ctx.fillText(input.value, p.x, p.y);
      }
      input.remove();
    });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });
  }

  window.wb_setTool = function(t) {
    tool = t;
    document.querySelectorAll('[id^="wb-tool-"]').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('wb-tool-' + t);
    if (btn) btn.classList.add('active');
  };

  window.wb_setColor = function(c) {
    color = c;
    document.querySelectorAll('.wb-color-swatch').forEach(s => s.classList.remove('active'));
    event.target.classList.add('active');
  };

  window.wb_setSize = function(s) { size = s; };

  window.wb_undo = function() {
    if (!history.length) return;
    redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    ctx.putImageData(history.pop(), 0, 0);
  };

  window.wb_redo = function() {
    if (!redoStack.length) return;
    history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    ctx.putImageData(redoStack.pop(), 0, 0);
  };

  window.wb_clear = function() {
    _saveHistory();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  };

  window.wb_export = function() {
    const dataUrl = canvas.toDataURL('image/png');
    const b64 = dataUrl.split(',')[1];
    _sendFlutter({ action: 'exportPDF', base64: b64, title: 'quadro-branco', isImage: true });
    showToast('Quadro exportado ✓');
  };

  window.wb_aiGenerate = function() {
    _sendFlutter({ action: 'modal', type: 'gemini', selectedText: 'Cria um esquema visual ou diagrama para: ' });
  };

  // Inicializar quando a view ficar visível
  window.openWhiteboard = function() {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-whiteboard').classList.add('active');
    setTimeout(wb_init, 100);
  };

  window.closeWhiteboard = function() {
    document.getElementById('view-whiteboard').classList.remove('active');
    // Volta ao editor
    document.getElementById('view-editor').classList.add('active');
  };
})();

</script>
</body>
