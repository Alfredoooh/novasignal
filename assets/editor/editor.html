<style>
/* ── Variáveis de tema ── */
:root {
  --acc:#e0185e; --acc-rgb:224,24,94; --acc-c:#fff;
  --bg:#ffffff; --card:#ffffff; --border:#f0f0f0;
  --text:#111; --sub:#8e8e93; --danger:#ff3b30;
  --paper:#ffffff; --paper-text:#111;
  --toolbar-bg:#ffffff; --toolbar-pill:#f2f2f7;
}
body[data-theme="dark"] {
  --acc:#ff6b9d; --acc-rgb:255,107,157; --acc-c:#000;
  --bg:#242424; --card:#363636; --border:#404040;
  --text:#e8e8e8; --sub:#8e8e93; --danger:#ff453a;
  --paper:#2e2e2e; --paper-text:#e0e0e0;
  --toolbar-bg:#363636; --toolbar-pill:#404040;
}

/* ── Reset ── */
*, *::before, *::after { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Syne',sans-serif; }

/* ── Transições de tema ── */
body, .view, .ed-header, .fmt-bar, .doc-scroll, .wb-toolbar {
  transition: background-color .3s ease, color .3s ease, border-color .3s ease;
}

/* ── Views ── */
.view { position:fixed; inset:0; display:none; flex-direction:column; background:var(--bg); overflow:hidden; }
.view.active { display:flex; }
#view-editor { z-index:10; }
#view-editor.slide-in  { animation:slideIn  .3s cubic-bezier(.4,0,.2,1) both; }
#view-editor.slide-out { animation:slideOut .25s cubic-bezier(.4,0,.2,1) both; }
@keyframes slideIn  { from{transform:translateX(100%)} to{transform:translateX(0)} }
@keyframes slideOut { from{transform:translateX(0)} to{transform:translateX(100%)} }
#view-whiteboard { z-index:15; }

/* ── Header do editor ── */
.ed-header {
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding: env(safe-area-inset-top, 44px) 12px 0;
  flex-shrink:0;
}
.ed-topbar {
  display:flex; align-items:center; height:52px; gap:4px;
}
.ed-title {
  flex:1; font-family:'Syne',sans-serif; font-weight:700;
  font-size:.95rem; color:var(--text); cursor:pointer;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  padding:0 6px;
}

/* ── Botões da barra ── */
.bar-btn {
  width:36px; height:36px; border:none; background:transparent;
  border-radius:50%; display:inline-flex; align-items:center;
  justify-content:center; cursor:pointer; color:var(--sub);
  transition:background .15s; padding:0; flex-shrink:0;
}
.bar-btn:active { background:var(--toolbar-pill); }
.bar-btn svg { pointer-events:none; }
.bar-btn-text {
  height:36px; border:none; background:transparent;
  border-radius:8px; padding:0 8px;
  font-family:'Syne',sans-serif; font-size:.75rem; font-weight:800;
  color:var(--acc); cursor:pointer; white-space:nowrap; flex-shrink:0;
}
.bar-btn-text:active { background:var(--toolbar-pill); }

/* ── Progress bar ── */
.progress-bar {
  height:2px; background:var(--border); position:relative; overflow:hidden;
}
.progress-bar-fill {
  position:absolute; top:0; left:-100%; width:100%; height:100%;
  background:var(--acc); opacity:0; transition:opacity .3s;
  animation:progressSlide 1.2s ease-in-out infinite;
}
.progress-bar-fill.on { opacity:1; }
@keyframes progressSlide { 0%{left:-100%} 100%{left:100%} }

/* ── Barra de formatação ── */
.fmt-bar {
  background:var(--toolbar-bg); border-bottom:1px solid var(--border);
  display:flex; align-items:center; height:48px; padding:0 10px;
  overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
  scrollbar-width:none; gap:2px;
}
.fmt-bar::-webkit-scrollbar { display:none; }
.tb-group {
  display:flex; align-items:center; background:var(--toolbar-pill);
  border-radius:10px; padding:3px; gap:1px; flex-shrink:0;
}
.tb-sep { width:1px; height:22px; background:var(--border); flex-shrink:0; margin:0 5px; }
.fb {
  width:32px; height:32px; border:none; background:transparent;
  border-radius:7px; display:inline-flex; align-items:center;
  justify-content:center; cursor:pointer; flex-shrink:0;
  color:var(--sub); transition:background .1s, color .1s; padding:0; line-height:1;
}
.fb svg { pointer-events:none; fill:var(--sub); transition:fill .1s; }
.fb:active, .fb.on { background:rgba(var(--acc-rgb),.15); color:var(--acc); }
.fb.on svg { fill:var(--acc); }
.tb-pill-btn {
  height:34px; border:none; background:var(--toolbar-pill);
  border-radius:10px; padding:0 22px 0 10px;
  display:inline-flex; align-items:center;
  cursor:pointer; flex-shrink:0; color:var(--text);
  font-family:'Syne',sans-serif; font-size:.75rem; font-weight:700;
  white-space:nowrap; position:relative;
}
.tb-pill-btn::after {
  content:''; position:absolute; right:7px; top:50%; transform:translateY(-50%);
  border-left:4px solid transparent; border-right:4px solid transparent;
  border-top:5px solid var(--sub); pointer-events:none;
}
.tb-pill-btn:active { opacity:.7; }
.tb-color-btn {
  width:32px; height:32px; border:none; background:transparent;
  border-radius:7px; display:inline-flex; align-items:center;
  justify-content:center; cursor:pointer; flex-shrink:0; padding:0;
}
.tb-color-btn:active { background:rgba(var(--acc-rgb),.15); }

/* ── Área do documento ── */
.doc-scroll {
  flex:1; overflow-y:auto; overflow-x:auto;
  background:var(--bg); padding:20px 0 80px;
  -webkit-overflow-scrolling:touch;
}
.doc-pages { display:flex; flex-direction:column; align-items:center; gap:16px; }

/* ── Página A4 ── */
.page-wrap {
  width:794px; height:1123px;
  background:var(--paper);
  box-shadow:0 1px 6px rgba(0,0,0,.2), 0 4px 20px rgba(0,0,0,.12);
  position:relative; flex-shrink:0; padding:94px; overflow:hidden;
  transform-origin:top center;
}
.page-editor {
  width:100%; height:100%; outline:none; border:none; background:transparent;
  font-family:Georgia,'Times New Roman',serif; font-size:16px; line-height:24px;
  color:var(--paper-text); overflow:hidden; resize:none;
  white-space:pre-wrap; word-break:break-word;
}
.page-editor:focus { outline:none; }
.page-editor.empty::before { content:attr(data-ph); color:#bbb; font-style:italic; pointer-events:none; }
.page-editor h1 { font-size:2em; font-family:'Syne',sans-serif; font-weight:800; margin:.4em 0 .2em; line-height:1.2; }
.page-editor h2 { font-size:1.4em; font-family:'Syne',sans-serif; font-weight:700; margin:.4em 0 .2em; }
.page-editor h3 { font-size:1.1em; font-family:'Syne',sans-serif; font-weight:600; margin:.4em 0 .15em; }
.page-editor p  { margin:0 0 .4em; }
.page-editor ul, .page-editor ol { padding-left:1.5em; margin:.3em 0; }
.page-editor blockquote { border-left:3px solid var(--acc); margin:.5em 0; padding-left:.8em; color:#666; font-style:italic; }
.page-num {
  position:absolute; bottom:36px; left:0; right:0; text-align:center;
  font-family:'Space Mono',monospace; font-size:9px; color:#bbb;
  letter-spacing:.05em; pointer-events:none;
}
.doc-meta {
  font-family:'Space Mono',monospace; font-size:.5rem;
  color:#aaa; text-align:center; padding:4px 0 0;
}

/* ── Resizable elements ── */
.resizable-element .el-controls { display:none; }

/* ── Whiteboard ── */
.wb-header {
  background:var(--card); border-bottom:1px solid var(--border);
  padding: env(safe-area-inset-top, 44px) 12px 0;
  flex-shrink:0;
}
.wb-topbar { display:flex; align-items:center; height:52px; gap:4px; }
.wb-toolbar {
  display:flex; align-items:center; gap:6px;
  padding:8px 12px; background:var(--toolbar-bg);
  border-bottom:1px solid var(--border); overflow-x:auto;
  scrollbar-width:none; flex-shrink:0;
}
.wb-toolbar::-webkit-scrollbar { display:none; }
.wb-canvas-wrap { flex:1; position:relative; overflow:hidden; background:#fff; touch-action:none; }
body[data-theme="dark"] .wb-canvas-wrap { background:#1a1a1a; }
#wb-canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
.wb-btn {
  width:36px; height:36px; border:none; border-radius:10px;
  background:var(--toolbar-pill); display:flex; align-items:center;
  justify-content:center; cursor:pointer; flex-shrink:0;
  color:var(--sub); font-size:16px; transition:background .1s;
}
.wb-btn.active { background:rgba(var(--acc-rgb),.2); color:var(--acc); }
.wb-btn:active { opacity:.7; }
.wb-color-swatch {
  width:26px; height:26px; border-radius:50%; border:2px solid transparent;
  cursor:pointer; flex-shrink:0; transition:transform .1s;
}
.wb-color-swatch.active { border-color:var(--acc); transform:scale(1.2); }
.wb-size-btn {
  height:32px; padding:0 12px; border:1px solid var(--border);
  border-radius:8px; background:var(--toolbar-pill); color:var(--text);
  font-family:'Syne',sans-serif; font-size:.75rem; font-weight:700;
  cursor:pointer; flex-shrink:0;
}

/* ── Toast ── */
.aria-toast {
  position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  left:50%; transform:translateX(-50%) translateY(20px);
  background:rgba(30,30,30,.92); color:#fff;
  font-family:'Syne',sans-serif; font-size:.82rem; font-weight:700;
  padding:10px 20px; border-radius:999px;
  white-space:nowrap; z-index:9999;
  opacity:0; transition:opacity .2s, transform .2s;
  pointer-events:none;
}
.aria-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>

<!-- ═══════════════════════════════════════════════
     PAINEL DE INSERÇÃO (nativo — sem Flutter)
════════════════════════════════════════════════ -->
<div id="insert-backdrop" onclick="closeInsertPanel()"
  style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;"></div>

<div id="insert-panel"
  style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:501;
         background:var(--card);border-radius:20px 20px 0 0;
         padding:0 0 env(safe-area-inset-bottom,16px);
         max-height:92vh;overflow-y:auto;
         transition:transform .28s cubic-bezier(.4,0,.2,1);
         transform:translateY(100%);">

  <!-- Handle -->
  <div style="text-align:center;padding:12px 0 0;">
    <div style="width:36px;height:4px;border-radius:2px;background:var(--border);display:inline-block;"></div>
  </div>

  <!-- Tabs -->
  <div id="ins-tabs" style="display:flex;border-bottom:1px solid var(--border);padding:0 16px;gap:0;">
    <button class="ins-tab active" onclick="switchInsTab('media')"   data-tab="media">Média</button>
    <button class="ins-tab"        onclick="switchInsTab('icons')"   data-tab="icons">Ícones</button>
    <button class="ins-tab"        onclick="switchInsTab('struct')"  data-tab="struct">Estrutura</button>
    <button class="ins-tab"        onclick="switchInsTab('special')" data-tab="special">Especial</button>
  </div>

  <!-- Tab: Média -->
  <div id="ins-tab-media" class="ins-tab-content" style="padding:16px;">
    <!-- Upload de imagem -->
    <div class="ins-section-label">Imagem</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <label class="ins-big-btn" style="cursor:pointer;">
        <span style="font-size:28px;">📁</span>
        <span>Galeria</span>
        <input type="file" accept="image/*" style="display:none;" onchange="handleImageUpload(event)"/>
      </label>
      <button class="ins-big-btn" onclick="promptImageUrl()">
        <span style="font-size:28px;">🔗</span>
        <span>URL</span>
      </button>
      <button class="ins-big-btn" onclick="openCamera()">
        <span style="font-size:28px;">📷</span>
        <span>Câmara</span>
      </button>
    </div>

    <!-- QR Code -->
    <div class="ins-section-label" style="margin-top:18px;">QR Code</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <input id="qr-input" type="text" placeholder="URL ou texto…"
        style="flex:1;height:42px;border:1.5px solid var(--border);border-radius:10px;
               padding:0 14px;font-family:'Syne',sans-serif;font-size:.85rem;
               background:var(--toolbar-pill);color:var(--text);outline:none;"/>
      <button onclick="insertQrFromPanel()"
        style="height:42px;padding:0 18px;border:none;border-radius:10px;
               background:var(--acc);color:var(--acc-c);
               font-family:'Syne',sans-serif;font-weight:800;font-size:.8rem;cursor:pointer;">
        Inserir
      </button>
    </div>

    <!-- Assinatura -->
    <div class="ins-section-label" style="margin-top:18px;">Assinatura</div>
    <button class="ins-big-btn" style="width:100%;justify-content:flex-start;gap:14px;padding:14px 18px;" onclick="closeInsertPanel();_openSignaturePad();">
      <span style="font-size:28px;">✍️</span>
      <span style="font-size:.9rem;">Desenhar assinatura</span>
    </button>
  </div>

  <!-- Tab: Ícones — pacotes oficiais via CDN -->
  <div id="ins-tab-icons" class="ins-tab-content" style="display:none;padding:12px 16px 0;">

    <!-- Linha de controlos -->
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
      <input id="icon-search" type="text" placeholder="Filtrar ícones do pacote…"
        oninput="filterIconPack(this.value)"
        style="flex:1;height:40px;border:1.5px solid var(--border);border-radius:10px;
               padding:0 12px;font-family:'Syne',sans-serif;font-size:.82rem;
               background:var(--toolbar-pill);color:var(--text);outline:none;"/>
      <input type="color" id="icon-color" value="#111111" title="Cor do ícone"
        style="width:36px;height:36px;border:1.5px solid var(--border);border-radius:8px;
               cursor:pointer;padding:2px;background:var(--toolbar-pill);"/>
      <select id="icon-size" onchange="updateIconSize(this.value)"
        style="height:36px;border:1.5px solid var(--border);border-radius:8px;
               padding:0 8px;background:var(--toolbar-pill);color:var(--text);
               font-family:'Syne',sans-serif;font-size:.78rem;outline:none;cursor:pointer;">
        <option value="16">16px</option>
        <option value="24" selected>24px</option>
        <option value="32">32px</option>
        <option value="48">48px</option>
        <option value="64">64px</option>
      </select>
    </div>

    <!-- Selector de pacote -->
    <div id="icon-packs"
      style="display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;
             scrollbar-width:none;-webkit-overflow-scrolling:touch;flex-shrink:0;">
    </div>

    <!-- Info do pacote activo -->
    <div id="icon-status"
      style="font-family:'Syne',sans-serif;font-size:.68rem;color:var(--sub);
             padding:2px 0 8px;min-height:16px;"></div>

    <!-- Grelha de ícones -->
    <div id="icon-grid"
      style="display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));
             gap:6px;max-height:44vh;overflow-y:auto;padding-bottom:16px;">
      <div style="grid-column:1/-1;text-align:center;padding:32px 0;
           font-family:'Syne',sans-serif;font-size:.82rem;color:var(--sub);">
        Escolhe um pacote acima ↑
      </div>
    </div>
  </div>

  <!-- Tab: Estrutura -->
  <div id="ins-tab-struct" class="ins-tab-content" style="display:none;padding:16px;">
    <div class="ins-section-label">Tabela</div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;">
      <input id="tbl-rows" type="number" value="3" min="1" max="20"
        style="width:72px;height:38px;border:1.5px solid var(--border);border-radius:8px;padding:0 10px;
               background:var(--toolbar-pill);color:var(--text);font-family:'Syne',sans-serif;font-size:.85rem;outline:none;"
        placeholder="Lin"/>
      <span style="color:var(--sub);font-size:.8rem;">×</span>
      <input id="tbl-cols" type="number" value="3" min="1" max="10"
        style="width:72px;height:38px;border:1.5px solid var(--border);border-radius:8px;padding:0 10px;
               background:var(--toolbar-pill);color:var(--text);font-family:'Syne',sans-serif;font-size:.85rem;outline:none;"
        placeholder="Col"/>
      <button onclick="insertTableFromPanel()"
        style="flex:1;height:38px;border:none;border-radius:8px;background:var(--acc);color:var(--acc-c);
               font-family:'Syne',sans-serif;font-weight:800;font-size:.8rem;cursor:pointer;">
        Inserir tabela
      </button>
    </div>
    <div class="ins-section-label">Bloco de código</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
      <button class="ins-row-btn" onclick="insertCode()">
        <span>💻</span><span>Código</span>
      </button>
      <button class="ins-row-btn" onclick="insertBlockquote()">
        <span>❝</span><span>Citação</span>
      </button>
      <button class="ins-row-btn" onclick="insertHr()">
        <span>━</span><span>Separador</span>
      </button>
      <button class="ins-row-btn" onclick="insertPageBreak()">
        <span>📄</span><span>Quebra pág.</span>
      </button>
    </div>
    <div class="ins-section-label">Link</div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
      <input id="link-text" type="text" placeholder="Texto do link"
        style="flex:1;height:38px;border:1.5px solid var(--border);border-radius:8px;padding:0 12px;
               background:var(--toolbar-pill);color:var(--text);font-family:'Syne',sans-serif;font-size:.82rem;outline:none;"/>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <input id="link-url" type="url" placeholder="https://…"
        style="flex:1;height:38px;border:1.5px solid var(--border);border-radius:8px;padding:0 12px;
               background:var(--toolbar-pill);color:var(--text);font-family:'Syne',sans-serif;font-size:.82rem;outline:none;"/>
      <button onclick="insertLinkFromPanel()"
        style="height:38px;padding:0 16px;border:none;border-radius:8px;background:var(--acc);color:var(--acc-c);
               font-family:'Syne',sans-serif;font-weight:800;font-size:.8rem;cursor:pointer;">
        OK
      </button>
    </div>
  </div>

  <!-- Tab: Especial -->
  <div id="ins-tab-special" class="ins-tab-content" style="display:none;padding:16px;">
    <div class="ins-section-label">Símbolos matemáticos</div>
    <div id="sym-grid" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;"></div>
    <div class="ins-section-label">Setas e formas</div>
    <div id="arrow-grid" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════
     PAINEL DE LAYOUT (nativo)
════════════════════════════════════════════════ -->
<div id="layout-backdrop" onclick="closeLayoutPanel()"
  style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;"></div>

<div id="layout-panel"
  style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:501;
         background:var(--card);border-radius:20px 20px 0 0;
         padding:0 0 env(safe-area-inset-bottom,16px);
         transition:transform .28s cubic-bezier(.4,0,.2,1);
         transform:translateY(100%);">
  <div style="text-align:center;padding:12px 0 8px;">
    <div style="width:36px;height:4px;border-radius:2px;background:var(--border);display:inline-block;"></div>
  </div>
  <div style="padding:0 16px 20px;">
    <div class="ins-section-label">Formato da página</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;">
      <button class="lay-btn" onclick="applyFormat('A4')">A4</button>
      <button class="lay-btn" onclick="applyFormat('A5')">A5</button>
      <button class="lay-btn" onclick="applyFormat('Letter')">Letter</button>
      <button class="lay-btn" onclick="applyFormat('Legal')">Legal</button>
    </div>
    <div class="ins-section-label">Margens</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;">
      <button class="lay-btn" onclick="applyMargin('Estreitas')">Estreitas</button>
      <button class="lay-btn lay-btn-active" onclick="applyMargin('Normais')">Normais</button>
      <button class="lay-btn" onclick="applyMargin('Largas')">Largas</button>
    </div>
    <div class="ins-section-label">Espaçamento entre linhas</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;">
      <button class="lay-btn" onclick="applySpacing('1.2')">Compacto</button>
      <button class="lay-btn lay-btn-active" onclick="applySpacing('1.5')">Normal</button>
      <button class="lay-btn" onclick="applySpacing('2')">Duplo</button>
      <button class="lay-btn" onclick="applySpacing('2.5')">Triplo</button>
    </div>
    <div class="ins-section-label">Tema do papel</div>
    <div style="display:flex;gap:10px;">
      <button class="lay-btn" style="flex:1;" onclick="applyPaperTheme('white')">☀️ Branco</button>
      <button class="lay-btn" style="flex:1;" onclick="applyPaperTheme('auto')">🌙 Automático</button>
    </div>
  </div>
</div>

// ════════════════════════════════════════════════
// ESCALA DO PAPEL A4
// ════════════════════════════════════════════════
function getScale() {
  return Math.min(1, (window.innerWidth - 24) / PAGE_W);
}
function applyScale() {
  const s = getScale();
  document.querySelectorAll('.page-wrap').forEach(p => {
    p.style.transform    = `scale(${s})`;
    p.style.marginBottom = `${(PAGE_H * s) - PAGE_H}px`;
  });
  document.getElementById('doc-pages').style.gap = `${Math.round(16 / s)}px`;
}
window.addEventListener('resize', applyScale);

// ════════════════════════════════════════════════
// PÁGINAS
// ════════════════════════════════════════════════
function createPage(idx) {
  const wrap = document.createElement('div');
  wrap.className = 'page-wrap';
  const ed = document.createElement('div');
  ed.className       = 'page-editor empty';
  ed.contentEditable = 'true';
  ed.setAttribute('data-ph', idx === 0 ? 'Comece a escrever…' : '');
  ed.setAttribute('data-page', String(idx));
  ed.addEventListener('input',   () => onInput(idx));
  ed.addEventListener('keydown', onKey);
  ed.addEventListener('mouseup', updateStates);
  ed.addEventListener('keyup',   updateStates);
  ed.addEventListener('focus',   () => { activePg = idx; });
  ed.addEventListener('input',   () => ed.classList.toggle('empty', ed.innerText.trim() === ''));
  const num = document.createElement('div');
  num.className = 'page-num';
  num.textContent = String(idx + 1);
  wrap.appendChild(ed);
  wrap.appendChild(num);
  document.getElementById('doc-pages').appendChild(wrap);
  const s = getScale();
  wrap.style.transform    = `scale(${s})`;
  wrap.style.marginBottom = `${(PAGE_H * s) - PAGE_H}px`;
  pages.push({ wrap, editor: ed });
  return ed;
}

// ── Reflow anti-travamento ─────────────────────────────────────
// Debounce: só corre 300ms depois do utilizador parar de escrever.
// Move blocos de nós em batch (não um a um) para reduzir reflows DOM.
let _reflowTimer = null;
function onInput(idx) {
  updateMeta(); updateStates();
  clearTimeout(_reflowTimer);
  _reflowTimer = setTimeout(() => reflow(idx), 300);
}

function reflow(startIdx) {
  // Passa para a frente: conteúdo que transborda vai para a página seguinte
  for (let i = startIdx; i < pages.length; i++) {
    const ed = pages[i].editor;
    if (ed.scrollHeight <= CONTENT_H) break;
    if (i + 1 >= pages.length) { createPage(pages.length); applyScale(); }
    const next = pages[i + 1].editor;
    // Batch: recolhe TODOS os nós a mover antes de inserir
    const toMove = [];
    while (ed.scrollHeight > CONTENT_H && ed.lastChild) {
      toMove.unshift(ed.lastChild);
      ed.removeChild(ed.lastChild);
    }
    // Insere em batch (um único reflow DOM em vez de N)
    const frag = document.createDocumentFragment();
    toMove.forEach(n => frag.appendChild(n));
    next.insertBefore(frag, next.firstChild);
  }
  // Passa para trás: reabsorve conteúdo que cabe na página anterior
  for (let i = pages.length - 2; i >= startIdx; i--) {
    const ed = pages[i].editor, next = pages[i + 1].editor;
    while (next.firstChild) {
      const node = next.firstChild;
      next.removeChild(node);
      ed.appendChild(node);
      if (ed.scrollHeight > CONTENT_H) {
        ed.removeChild(node);
        next.insertBefore(node, next.firstChild);
        break;
      }
    }
  }
  // Remove páginas vazias no fim
  for (let i = pages.length - 1; i >= 1; i--) {
    const ed = pages[i].editor;
    if (!ed.childNodes.length && !ed.innerText.trim()) { pages[i].wrap.remove(); pages.splice(i, 1); }
    else break;
  }
  renumber(); updateMeta();
}
function renumber() {
  pages.forEach((p, i) => {
    const n = p.wrap.querySelector('.page-num');
    if (n) n.textContent = String(i + 1);
    p.editor.setAttribute('data-page', String(i));
  });
}
function updateMeta() {
  const t = pages.map(p => p.editor.innerText).join(' ').trim();
  const w = t ? t.split(/\s+/).filter(Boolean).length : 0;
  document.getElementById('doc-meta').textContent = `${w} palavra${w!==1?'s':''} · ${t.length} car. · ${pages.length} pág.`;
}
function getActiveEditor() { return pages[activePg]?.editor || pages[0]?.editor; }

// ════════════════════════════════════════════════
// FORMATAÇÃO
// ════════════════════════════════════════════════
function fmt(cmd) {
  const ed = getActiveEditor(); if (!ed) return;
  ed.focus(); document.execCommand(cmd, false, null); updateStates();
}
function fmtAlign(cmd) {
  fmt(cmd);
  ['btn-jl','btn-jc','btn-jr','btn-jf'].forEach(id => document.getElementById(id)?.classList.remove('on'));
  const map = {justifyLeft:'btn-jl',justifyCenter:'btn-jc',justifyRight:'btn-jr',justifyFull:'btn-jf'};
  if (map[cmd]) document.getElementById(map[cmd])?.classList.add('on');
}
function updateStates() {
  ['b','i','u','s','ul','ol','sup','sub'].forEach(k => {
    const cmd = {b:'bold',i:'italic',u:'underline',s:'strikeThrough',ul:'insertUnorderedList',ol:'insertOrderedList',sup:'superscript',sub:'subscript'}[k];
    document.getElementById('btn-'+k)?.classList.toggle('on', document.queryCommandState(cmd));
  });
}
function onKey(e) {
  if (e.key==='Tab') { e.preventDefault(); document.execCommand('insertHTML',false,'\u00a0\u00a0\u00a0\u00a0'); }
}

// ════════════════════════════════════════════════
// FLUTTER BRIDGE
// ════════════════════════════════════════════════
function _sendFlutter(obj) {
  const msg = JSON.stringify(obj);
  if (window.flutter_inappwebview) {
    window.flutter_inappwebview.callHandler('FlutterBridge', msg);
  } else if (window.parent && window.parent !== window) {
    window.parent.postMessage(obj, '*');
  }
}

let _range = null;
function saveRange() {
  const s = window.getSelection();
  _range = (s && s.rangeCount) ? s.getRangeAt(0).cloneRange() : null;
}
function restoreRange() {
  if (!_range) return;
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(_range); _range = null;
}

// ════════════════════════════════════════════════
// MODAIS (delegados ao Flutter)
// ════════════════════════════════════════════════
window.openStyleModal  = function() { saveRange(); _sendFlutter({ action:'modal', type:'style',  current:curStyle }); };
window.openFontModal   = function() { saveRange(); _sendFlutter({ action:'modal', type:'font',   current:curFont, fonts:FONT_DEFS }); };
window.openSizeModal   = function() { saveRange(); _sendFlutter({ action:'modal', type:'size',   current:curSize, sizes:SIZES }); };
window.openColorModal  = function() { saveRange(); _sendFlutter({ action:'modal', type:'color',  current:curColor, presets:PRESET_COLORS }); };
window.openBgColorModal= function() { saveRange(); _sendFlutter({ action:'modal', type:'bgColor',current:_curBgColor }); };
window.openOpcoes      = function() { _sendFlutter({ action:'modal', type:'opcoes' }); };
window.openInsertModal = function() { _sendFlutter({action:'modal',type:'insert'}); };
window.openLayoutModal = function() { _sendFlutter({action:'modal',type:'layout'}); };
window.openRenameDialog= function() { _sendFlutter({ action:'modal', type:'rename', current:window._docTitle||'' }); };
window.openGemini      = function() {
  const sel = (window.getSelection()?.toString()||'').trim();
  saveRange();
  _sendFlutter({ action:'modal', type:'gemini', selectedText: sel.slice(0,200) });
};
window.openFindReplace = function() { _sendFlutter({ action:'modal', type:'findReplace' }); };

// ════════════════════════════════════════════════
// RESPOSTA DE MODAL DO FLUTTER
// ════════════════════════════════════════════════
window._modalResult = function(data) {
  const type = data.type;
  const ed = getActiveEditor();
  if (ed) { ed.focus(); restoreRange(); }

  if (type === 'style') {
    const labels = { h1:'Título', h2:'Subtítulo', h3:'Secção', p:'Corpo', blockquote:'Citação' };
    curStyle = data.tag;
    const el = document.getElementById('style-label');
    if (el) el.textContent = labels[data.tag] || data.tag;
    document.execCommand('formatBlock', false, data.tag);

  } else if (type === 'font') {
    curFont = data.family;
    const el = document.getElementById('font-label');
    if (el) el.textContent = data.label;
    document.execCommand('fontName', false, data.family);

  } else if (type === 'size') {
    curSize = data.size;
    const el = document.getElementById('size-label');
    if (el) el.textContent = String(data.size);
    document.execCommand('fontSize', false, '7');
    if (ed) ed.querySelectorAll('font[size="7"]').forEach(e => {
      e.removeAttribute('size'); e.style.fontSize = data.size + 'px';
    });

  } else if (type === 'color') {
    curColor = data.color;
    const dot = document.getElementById('color-dot');
    if (dot) dot.style.background = curColor;
    document.execCommand('foreColor', false, curColor);

  } else if (type === 'bgColor') {
    _curBgColor = data.color;
    const dot = document.getElementById('bg-color-dot');
    if (dot) dot.style.background = data.color === 'transparent' ? 'transparent' : data.color;
    document.execCommand('hiliteColor', false, data.color === 'transparent' ? 'transparent' : data.color);

  } else if (type === 'link') {
    if (data.url) {
      if (data.text) document.execCommand('insertHTML', false, `<a href="${data.url}" target="_blank">${data.text||data.url}</a>`);
      else { document.execCommand('createLink', false, data.url); if(ed) ed.querySelectorAll('a').forEach(a => a.target='_blank'); }
    }

  } else if (type === 'image') {
    if (data.url) _insertResizableImageUrl(data.url, data.alt || 'imagem');

  } else if (type === 'imageUpload') {
    if (data.base64 && data.mime) _insertResizableImage(`data:${data.mime};base64,${data.base64}`, data.alt||'imagem');

  } else if (type === 'qrcode') {
    if (data.content) _insertQrCode(data.content);

  } else if (type === 'sticker') {
    if (data.icon) _insertSticker(data.icon, data.color||'#e0185e');

  } else if (type === 'table') {
    const r = parseInt(data.rows)||3, c = parseInt(data.cols)||3;
    const headerRow = Array.from({length:c},(_,i)=>`<th style="border:1px solid #ccc;padding:6px 10px;background:rgba(0,0,0,.05);">Cabeçalho ${i+1}</th>`).join('');
    const bodyRow   = Array.from({length:c},()=>`<td style="border:1px solid #ccc;padding:6px 10px;">Célula</td>`).join('');
    const bodyRows  = Array.from({length:Math.max(1,r-1)},()=>`<tr>${bodyRow}</tr>`).join('');
    document.execCommand('insertHTML', false, `<table style="border-collapse:collapse;width:100%;margin:.5em 0;"><thead><tr>${headerRow}</tr></thead><tbody>${bodyRows}</tbody></table><p><br></p>`);

  } else if (type === 'insert') {
    if      (data.action==='hr')          document.execCommand('insertHorizontalRule',false,null);
    else if (data.action==='blockquote')  document.execCommand('formatBlock',false,'blockquote');
    else if (data.action==='code')        document.execCommand('insertHTML',false,'<pre style="background:rgba(0,0,0,.06);border-radius:8px;padding:12px 14px;font-family:\'Space Mono\',monospace;font-size:.82rem;margin:.5em 0;overflow-x:auto;"><code>// código aqui</code></pre><p><br></p>');
    else if (data.action==='ul')          fmt('insertUnorderedList');
    else if (data.action==='ol')          fmt('insertOrderedList');
    else if (data.action==='pageBreak')   document.execCommand('insertHTML',false,'<div style="page-break-after:always;height:0;"></div>');
    else if (data.action==='table')       _sendFlutter({ action:'modal', type:'table' });
    else if (data.action==='link')        _sendFlutter({ action:'modal', type:'link', text:(window.getSelection()?.toString()||'') });
    else if (data.action==='image')       _sendFlutter({ action:'modal', type:'image' });
    else if (data.action==='imageUpload') _sendFlutter({ action:'modal', type:'imageUpload' });
    else if (data.action==='qrcode')      _sendFlutter({ action:'modal', type:'qrcode' });
    else if (data.action==='sticker')     _sendFlutter({ action:'modal', type:'sticker' });
    else if (data.action==='signature')   _openSignaturePad();

  } else if (type === 'opcoes') {
    if      (data.action==='exportPDF')    exportPDF();
    else if (data.action==='exportTXT')    exportTXT();
    else if (data.action==='sharePDF')     sharePDF();
    else if (data.action==='stats')        showDocStats();
    else if (data.action==='findReplace')  window.openFindReplace();
    else if (data.action==='print')        window.print();
    else if (data.action==='duplicate')    duplicatePage();
    else if (data.action==='newPage')      addPageManual();
    else if (data.action==='whitePaper')   toggleWhitePaper();
    else if (data.action==='clearAll')     clearAll();
    else if (data.action==='whiteboard')   window.openWhiteboard();

  } else if (type === 'gemini') {
    if (data.action) aiRun(data.action);

  } else if (type === 'layout') {
    if (data.format) {
      const formats = { A4:{w:794,h:1123}, A5:{w:559,h:794}, Letter:{w:816,h:1056}, Legal:{w:816,h:1344} };
      const f = formats[data.format];
      if (f) { document.querySelectorAll('.page-wrap').forEach(p=>{ p.style.width=f.w+'px'; p.style.height=f.h+'px'; }); applyScale(); }
    }
    if (data.margin) {
      const margins = { Estreitas:{v:48,h:48}, Normais:{v:94,h:94}, Largas:{v:120,h:120} };
      const m = margins[data.margin];
      if (m) document.querySelectorAll('.page-editor').forEach(p=>{ p.parentElement.style.padding=m.v+'px '+m.h+'px'; });
    }
    if (data.spacing) document.querySelectorAll('.page-editor').forEach(p=>{ p.style.lineHeight=data.spacing; });

  } else if (type === 'findReplace') {
    if (data.action==='replace' && data.find) {
      const re = new RegExp(data.find.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
      let n = 0;
      pages.forEach(p=>{ p.editor.innerHTML = p.editor.innerHTML.replace(re,()=>{n++;return data.replaceWith||'';}); });
      updateMeta();
      showToast(`${n} substituição(ões) efectuada(s)`);
    }

  } else if (type === 'rename') {
    if (data.title) {
      window._docTitle = data.title;
      const el = document.getElementById('doc-title-text');
      if (el) el.textContent = data.title;
    }
  }
};

window.saveDocument = function() {
  const html  = pages.map(p => p.editor.innerHTML).join('<!-- PAGE_BREAK -->');
  const text  = pages.map(p => p.editor.innerText).join('\n\n').trim();
  const words = text ? text.split(/\s+/).filter(Boolean).length : 0;
  _sendFlutter({ action:'save', id:window._docId, title:window._docTitle, data:JSON.stringify({html,text,words,title:window._docTitle}) });
};
window.getDocumentContent = function() {
  const html  = pages.map(p => p.editor.innerHTML).join('<!-- PAGE_BREAK -->');
  const text  = pages.map(p => p.editor.innerText).join('\n\n').trim();
  const words = text ? text.split(/\s+/).filter(Boolean).length : 0;
  return JSON.stringify({ html, text, words, title:window._docTitle });
};

function _extractBodyOnly(raw) {
  if (!raw || typeof raw !== 'string') return '';
  const t = raw.trim();
  if (/^<!DOCTYPE|^<html/i.test(t)) {
    const m = t.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
    if (m) return m[1].trim();
  }
  return t;
}
function _isFullHtmlTemplate(raw) {
  if (!raw) return false;
  const t = raw.trim();
  return /^<!DOCTYPE|^<html/i.test(t) || (/<style[\s\S]*?<\/style>/i.test(t) && /<body/i.test(t));
}

function _splitIntoPages(rawHtml, id, title, isNew) {
  document.getElementById('doc-pages').innerHTML = '';
  pages = []; activePg = 0;
  window._docId    = id    || null;
  window._docTitle = title || 'Sem título';
  const titleEl = document.getElementById('doc-title-text');
  if (titleEl) titleEl.textContent = window._docTitle;

  if (!rawHtml || !rawHtml.trim()) {
    _isTemplateMode = false;
    createPage(0); applyScale(); updateMeta();
    if (isNew) setTimeout(() => pages[0]?.editor?.focus(), 300);
    return;
  }

  if (_isFullHtmlTemplate(rawHtml) && !rawHtml.includes('<!-- PAGE_BREAK -->')) {
    _isTemplateMode = true;
    _renderTemplateHtml(rawHtml);
    return;
  }

  _isTemplateMode = false;
  const bodyHtml = _extractBodyOnly(rawHtml);
  const parts = bodyHtml.split('<!-- PAGE_BREAK -->').filter(p => p.trim());

  if (parts.length === 0) { createPage(0); applyScale(); updateMeta(); return; }

  parts.forEach((part, i) => {
    createPage(i);
    if (pages[i]) {
      pages[i].editor.innerHTML = part.trim();
      if (part.trim()) pages[i].editor.classList.remove('empty');
    }
  });

  if (!isNew) pages.forEach(p => { p.editor.classList.remove('empty'); p.editor.setAttribute('data-ph',''); });

  applyScale(); updateMeta();
  if (isNew) setTimeout(() => pages[0]?.editor?.focus(), 300);
}

function _renderTemplateHtml(html) {
  const docPages = document.getElementById('doc-pages');
  docPages.innerHTML = '';
  pages = []; activePg = 0;

  const wrap = document.createElement('div');
  wrap.className = 'page-wrap template-iframe-wrap';
  wrap.style.cssText = 'height:auto;min-height:1123px;overflow:visible;padding:0;';

  const iframe = document.createElement('iframe');
  iframe.id = 'template-iframe';
  iframe.style.cssText = 'width:794px;border:none;display:block;background:#fff;';
  iframe.setAttribute('scrolling','no');
  wrap.appendChild(iframe);
  docPages.appendChild(wrap);

  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open(); doc.write(html); doc.close();

  function resizeIframe() {
    try {
      const h = doc.body ? Math.max(doc.body.scrollHeight, 1123) : 1123;
      iframe.style.height = h + 'px';
      wrap.style.height   = h + 'px';
    } catch(e) {}
  }
  setTimeout(resizeIframe, 200); setTimeout(resizeIframe, 600);

  const fakeEd = document.createElement('div');
  fakeEd.className = 'page-editor';
  fakeEd.innerHTML = html;
  fakeEd.style.display = 'none';
  wrap.appendChild(fakeEd);
  pages.push({ wrap, editor: fakeEd });

  const s = getScale();
  wrap.style.transform    = `scale(${s})`;
  wrap.style.marginBottom = `${(1123 * s) - 1123}px`;

  updateMeta(); showToast('Template carregado ✓');
}

window.loadContent = function(rawHtml, title, id, isNew) {
  setTimeout(() => {
    if (rawHtml && /<!DOCTYPE|<html/i.test(rawHtml.trim())) {
      const styleMatches = rawHtml.match(/<style[^>]*>([\s\S]*?)<\/style>/gi) || [];
      styleMatches.forEach(styleBlock => {
        const existing = document.getElementById('tpl-styles');
        if (existing) existing.remove();
        const styleEl = document.createElement('style');
        styleEl.id = 'tpl-styles';
        styleEl.textContent = styleBlock.replace(/<\/?style[^>]*>/gi,'');
        document.head.appendChild(styleEl);
      });
    }
    _splitIntoPages(rawHtml, id, title, isNew);
  }, 10);
};
window.loadDocument = function(id, title, htmlContent) {
  _splitIntoPages(htmlContent, id, title, !htmlContent || !htmlContent.trim());
};
window.setDocTitle = function(t) {
  window._docTitle = t;
  const el = document.getElementById('doc-title-text');
  if (el) el.textContent = t;
};

// ════════════════════════════════════════════════
window.loadDocxBase64 = function(b64Str) {
  try {
    const binaryStr = atob(b64Str);
    const bytes     = new Uint8Array(binaryStr.length);
    for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
    mammoth.convertToHtml({ arrayBuffer: bytes.buffer })
      .then(result => {
        const html = result.value || '<p>Documento vazio</p>';
        document.getElementById('doc-pages').innerHTML = '';
        pages = []; activePg = 0;
        createPage(0); applyScale();
        const div = document.createElement('div');
        div.innerHTML = html;
        const children = Array.from(div.children);
        let pageIdx = 0, charCount = 0;
        const CHARS_PER_PAGE = 1800;
        children.forEach(child => {
          if (pageIdx >= pages.length) createPage(pageIdx);
          pages[pageIdx].editor.appendChild(child.cloneNode(true));
          charCount += (child.textContent||'').length;
          if (charCount >= CHARS_PER_PAGE) { pageIdx++; charCount=0; createPage(pageIdx); applyScale(); }
        });
        updateMeta(); showToast('DOCX carregado!');
      })
      .catch(err => { showToast('Erro ao converter DOCX'); console.error(err); });
  } catch(e) { showToast('Erro ao carregar DOCX'); console.error(e); }
};

// EXPORTAR PDF
// ════════════════════════════════════════════════
async function exportPDF() {
  showToast('A gerar PDF…'); setProgress(true);
  let attempts = 0;
  while (typeof window.jspdf === 'undefined' && attempts < 20) {
    await new Promise(r => setTimeout(r, 200)); attempts++;
  }
  if (typeof window.jspdf === 'undefined') {
    setProgress(false);
    _sendFlutter({ action:'exportPDF_html', html:_buildFullHtmlExport(), title:window._docTitle||'documento' });
    return;
  }
  try {
    const { jsPDF } = window.jspdf;
    if (_isTemplateMode) {
      const iframe = document.getElementById('template-iframe');
      if (iframe) {
        const wrap = iframe.parentElement;
        const origT = wrap.style.transform; wrap.style.transform = 'none';
        const canvas = await html2canvas(iframe.contentDocument.body, { scale:2, useCORS:true, logging:false, backgroundColor:'#fff', allowTaint:true });
        wrap.style.transform = origT;
        const w = canvas.width/2, h = canvas.height/2;
        const pdfH = (h/w)*794;
        const pdfDoc = new jsPDF({ unit:'px', format:[794,pdfH], orientation:'portrait' });
        pdfDoc.addImage(canvas.toDataURL('image/jpeg',.95),'JPEG',0,0,794,pdfH);
        setProgress(false);
        _sendFlutter({ action:'exportPDF', base64:pdfDoc.output('datauristring').split(',')[1], title:window._docTitle||'documento' });
        showToast('PDF gerado!'); return;
      }
    }
    const pdf = new jsPDF({ unit:'px', format:[794,1123], orientation:'portrait', hotfixes:['px_scaling'] });
    for (let i = 0; i < pages.length; i++) {
      const wrap = pages[i].wrap;
      const origT = wrap.style.transform, origM = wrap.style.marginBottom;
      wrap.style.transform = 'none'; wrap.style.marginBottom = '0';
      wrap.style.background = '#fff';
      pages[i].editor.style.color = '#111';
      const canvas = await html2canvas(wrap, { scale:2, useCORS:true, logging:false, backgroundColor:'#fff', width:794, height:1123 });
      wrap.style.transform = origT; wrap.style.marginBottom = origM;
      wrap.style.background = ''; pages[i].editor.style.color = '';
      if (i > 0) pdf.addPage([794,1123],'portrait');
      pdf.addImage(canvas.toDataURL('image/jpeg',.92),'JPEG',0,0,794,1123);
    }
    applyScale(); setProgress(false);
    _sendFlutter({ action:'exportPDF', base64:pdf.output('datauristring').split(',')[1], title:window._docTitle||'documento' });
    showToast('PDF gerado! ✓');
  } catch(err) {
    setProgress(false); applyScale(); console.error(err);
    _sendFlutter({ action:'exportPDF_html', html:_buildFullHtmlExport(), title:window._docTitle||'documento' });
    showToast('PDF via fallback');
  }
}
function _buildFullHtmlExport() {
  if (_isTemplateMode) {
    const iframe = document.getElementById('template-iframe');
    if (iframe) try { return iframe.contentDocument.documentElement.outerHTML; } catch(e) {}
    return pages.map(p => p.editor.innerHTML).join('');
  }
  const body = pages.map(p => `<div class="page" style="page-break-after:always;padding:94px;width:794px;min-height:1123px;box-sizing:border-box;background:#fff;font-family:Georgia,serif;line-height:1.65;">${p.editor.innerHTML}</div>`).join('');
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${window._docTitle}</title><style>body{margin:0;background:#fff;}@media print{.page{page-break-after:always;}}</style></head><body>${body}</body></html>`;
}
function exportTXT() {
  const b = new Blob([pages.map(p=>p.editor.innerText).join('\n\n--- Página ---\n\n')],{type:'text/plain'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(b); a.download='documento.txt'; a.click();
  showToast('TXT exportado!');
}
async function sharePDF() { if(navigator.share) try{await navigator.share({title:'Documento Aria'});}catch(e){} else showToast('Partilha não suportada'); }
function addPageManual() { createPage(pages.length); applyScale(); }
function clearAll() { document.getElementById('doc-pages').innerHTML=''; pages=[]; activePg=0; createPage(0); applyScale(); updateMeta(); showToast('Documento limpo'); }
function duplicatePage() {
  if (!pages[activePg]) return;
  const html = pages[activePg].editor.innerHTML;
  createPage(pages.length);
  pages[pages.length-1].editor.innerHTML = html;
  applyScale(); updateMeta(); showToast('Página duplicada');
}
let _whitePaperForced = false;
function toggleWhitePaper() {
  _whitePaperForced = !_whitePaperForced;
  document.querySelectorAll('.page-wrap').forEach(p => {
    p.style.background = _whitePaperForced ? '#ffffff' : '';
    p.querySelector('.page-editor').style.color = _whitePaperForced ? '#111111' : '';
  });
  showToast(_whitePaperForced ? 'Papel branco ativado' : 'Papel voltou ao tema');
}
function showDocStats() {
  const text = pages.map(p=>p.editor.innerText).join(' ').trim();
  const words = text ? text.split(/\s+/).filter(Boolean).length : 0;
  _sendFlutter({ action:'modal', type:'stats', words, chars:text.length, charsNoSp:text.replace(/\s/g,'').length, sentences:(text.match(/[.!?]+/g)||[]).length, pages:pages.length, readMin:Math.max(1,Math.round(words/200)) });
}

window.ariaSearch = async function(query) {
  setProgress(true); showToast('A pesquisar…');
  try {
    const headers = { 'Content-Type':'application/json' };
    if (ARIA_TOKEN) headers['Authorization'] = 'Bearer ' + ARIA_TOKEN;
    const resp = await fetch(ARIA_WORKER + '/ask', { method:'POST', headers, body:JSON.stringify({ query, mode:'search' }) });
    if (resp.ok) {
      const d = await resp.json();
      if (d.answer) {
        setProgress(false);
        const html = d.answer.replace(/\n/g,'<br>').replace(/^#{1,3} (.+)$/gm,'<strong>$1</strong>');
        document.execCommand('insertHTML', false, '<p>' + html + '</p>');
        showToast('Pesquisa concluída ✓'); return;
      }
    }
  } catch(e) { console.warn('ariaSearch error:', e); }
  setProgress(false); showToast('Erro na pesquisa');
};
window.ariaLogin = async function(email, password) {
  const r = await fetch(ARIA_WORKER + '/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email,password}) });
  const d = await r.json();
  if (d.token) ARIA_TOKEN = d.token;
  return d;
};
window.ariaRegister = async function(name, email, password) {
  const r = await fetch(ARIA_WORKER + '/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name,email,password}) });
  const d = await r.json();
  if (d.token) ARIA_TOKEN = d.token;
  return d;
};
window.setAriaToken = function(token) { ARIA_TOKEN = token; };

async function aiRun(action) {
  if (action === '🔍 Pesquisar na internet') {
    const sel = window.getSelection()?.toString().trim();
    const ed  = getActiveEditor();
    const ctx = sel || (ed ? ed.innerText.slice(0,300) : '');
    if (!ctx) { showToast('Escreve ou seleciona o tema a pesquisar'); return; }
    window.ariaSearch(ctx); return;
  }
  const ed = getActiveEditor();
  const selectedText = window.getSelection()?.toString().trim() || '';
  const contextText  = selectedText || (ed ? ed.innerText.slice(0,500) : '');
  if (!contextText && !['Criar lista com pontos','Explicar conceito'].includes(action)) {
    showToast('Seleciona texto primeiro'); return;
  }
  setProgress(true); showToast('IA a processar…');
  const prompts = {
    'Melhorar escrita':    `Melhora a escrita do seguinte texto, mantendo o significado e o tom. Retorna APENAS o texto melhorado:\n\n${contextText}`,
    'Resumir':             `Resume o seguinte texto de forma concisa. Retorna APENAS o resumo:\n\n${contextText}`,
    'Continuar texto':     `Continua o seguinte texto de forma natural. Retorna APENAS a continuação:\n\n${contextText}`,
    'Encurtar texto':      `Encurta o seguinte texto mantendo as ideias principais. Retorna APENAS o texto:\n\n${contextText}`,
    'Expandir texto':      `Expande com mais detalhes. Retorna APENAS o texto:\n\n${contextText}`,
    'Traduzir para inglês':  `Traduz para inglês. Retorna APENAS a tradução:\n\n${contextText}`,
    'Traduzir para espanhol':`Traduz para espanhol. Retorna APENAS a tradução:\n\n${contextText}`,
    'Traduzir para francês': `Traduz para francês. Retorna APENAS a tradução:\n\n${contextText}`,
    'Corrigir gramática':  `Corrige gramática e ortografia. Retorna APENAS o texto corrigido:\n\n${contextText}`,
    'Tom formal':          `Reescreve com tom formal. Retorna APENAS o texto:\n\n${contextText}`,
    'Tom casual':          `Reescreve com tom casual. Retorna APENAS o texto:\n\n${contextText}`,
    'Tom persuasivo':      `Reescreve de forma persuasiva. Retorna APENAS o texto:\n\n${contextText}`,
    'Criar lista com pontos': `Cria uma lista de pontos sobre: ${contextText||'o tema do documento'}. Retorna em HTML com <ul><li>...</li></ul>`,
    'Explicar conceito':   `Explica de forma clara: ${contextText||'o tema do documento'}. Retorna APENAS a explicação.`,
  };
  const prompt = prompts[action] || `Aplica "${action}" ao texto:\n\n${contextText}`;
  try {
    const headers = { 'Content-Type':'application/json' };
    if (ARIA_TOKEN) headers['Authorization'] = 'Bearer ' + ARIA_TOKEN;
    const resp = await fetch(ARIA_WORKER + '/generate', { method:'POST', headers, body:JSON.stringify({ prompt, system:'Responde APENAS com o texto solicitado, sem explicações. Em português.' }) });
    if (resp.ok) {
      const data = await resp.json();
      if (data.text) { window._aiResponse({ text:data.text }); return; }
    }
  } catch(_) {}
  _sendFlutter({ action:'aiRequest', prompt, aiAction:action, selectedText });
}
window._aiResponse = function(data) {
  setProgress(false);
  if (!data || !data.text) { showToast('IA: sem resposta'); return; }
  const ed = getActiveEditor();
  if (ed) ed.focus();
  restoreRange();

  // Normaliza a resposta — se vier HTML usa directamente, senão converte
  const raw = data.text.trim();
  const isHtml = /^<[a-zA-Z]/.test(raw);
  const html = isHtml ? raw : '<p>' + raw.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>') + '</p>';

  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
    // Substitui selecção
    const range = sel.getRangeAt(0);
    range.deleteContents();
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    const frag = document.createDocumentFragment();
    while (tmp.firstChild) frag.appendChild(tmp.firstChild);
    range.insertNode(frag);
  } else {
    document.execCommand('insertHTML', false, html);
  }
  updateMeta(); showToast('IA: texto aplicado ✓');
};

function _insertResizableImage(src, alt) {
  const id = 'img_' + Date.now();
  document.execCommand('insertHTML', false, `
    <div class="resizable-element" id="${id}" contenteditable="false"
      style="display:inline-block;position:relative;user-select:none;margin:8px 0;max-width:100%;">
      <img src="${src}" alt="${alt}"
        style="width:300px;max-width:100%;display:block;border:2px solid transparent;cursor:pointer;"
        onclick="selectElement('${id}')" draggable="false"/>
      <div class="el-controls" style="display:none;position:absolute;bottom:-32px;left:0;
        background:var(--acc);border-radius:6px;padding:4px;gap:4px;align-items:center;z-index:100;">
        <button onclick="resizeEl('${id}',-50)" style="background:none;border:none;color:#fff;cursor:pointer;font-size:14px;">−</button>
        <button onclick="resizeEl('${id}',50)"  style="background:none;border:none;color:#fff;cursor:pointer;font-size:14px;">+</button>
        <button onclick="deleteEl('${id}')" style="background:none;border:none;color:#fff;cursor:pointer;font-size:12px;">🗑</button>
      </div>
    </div><p><br></p>`);
}
function _insertResizableImageUrl(src, alt) { _insertResizableImage(src, alt); }
function selectElement(id) {
  document.querySelectorAll('.resizable-element').forEach(el => {
    const ctrl = el.querySelector('.el-controls');
    const img  = el.querySelector('img,svg,.sticker-icon');
    if (ctrl) ctrl.style.display='none';
    if (img)  img.style.border='2px solid transparent';
  });
  const el = document.getElementById(id); if (!el) return;
  const ctrl = el.querySelector('.el-controls');
  const img  = el.querySelector('img,svg,.sticker-icon');
  if (ctrl) ctrl.style.display='flex';
  if (img)  img.style.border='2px solid var(--acc)';
}
function resizeEl(id, delta) {
  const el = document.getElementById(id); if (!el) return;
  const img = el.querySelector('img,.sticker-icon'); if (!img) return;
  img.style.width = Math.max(40, Math.min(700, (img.offsetWidth||100) + delta)) + 'px';
}
function deleteEl(id) { const el = document.getElementById(id); if (el) el.remove(); }
document.addEventListener('click', e => {
  if (!e.target.closest('.resizable-element')) {
    document.querySelectorAll('.resizable-element').forEach(el => {
      const ctrl = el.querySelector('.el-controls');
      const img  = el.querySelector('img,.sticker-icon');
      if (ctrl) ctrl.style.display='none';
      if (img)  img.style.border='2px solid transparent';
    });
  }
});

  if (existing) existing.remove();

  modal.id = 'sig-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:flex-end;justify-content:center;';

    <div style="background:var(--card);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:500px;">
      <div style="text-align:center;margin-bottom:12px;font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;color:var(--text);">Desenha a assinatura</div>
      <canvas id="sig-canvas" width="400" height="160"
        style="width:100%;border:1.5px solid var(--border);border-radius:12px;touch-action:none;background:#fff;display:block;"></canvas>
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button onclick="clearSig()" style="flex:1;padding:14px;border:1.5px solid var(--border);border-radius:999px;background:none;color:var(--text);font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;">Limpar</button>
        <button onclick="cancelSig()" style="flex:1;padding:14px;border:1.5px solid var(--border);border-radius:999px;background:none;color:var(--sub);font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;">Cancelar</button>
        <button onclick="saveSig()" style="flex:2;padding:14px;border:none;border-radius:999px;background:var(--acc);color:#fff;font-family:'Syne',sans-serif;font-weight:800;cursor:pointer;">Inserir</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  const canvas = document.getElementById('sig-canvas');
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  let drawing = false, lx = 0, ly = 0;
  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x:(src.clientX-r.left)*(canvas.width/r.width), y:(src.clientY-r.top)*(canvas.height/r.height) };
  }
  canvas.addEventListener('mousedown',  e => { drawing=true; const p=getPos(e); lx=p.x; ly=p.y; });
  canvas.addEventListener('mousemove',  e => { if(!drawing) return; const p=getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke(); lx=p.x; ly=p.y; });
  canvas.addEventListener('mouseup',    () => drawing=false);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); drawing=true; const p=getPos(e); lx=p.x; ly=p.y; }, {passive:false});
  canvas.addEventListener('touchmove',  e => { e.preventDefault(); if(!drawing) return; const p=getPos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke(); lx=p.x; ly=p.y; }, {passive:false});
  canvas.addEventListener('touchend',   () => drawing=false);
  window.clearSig  = () => ctx.clearRect(0,0,canvas.width,canvas.height);
  window.cancelSig = () => modal.remove();
  window.saveSig   = () => { const src = canvas.toDataURL('image/png'); modal.remove(); _insertResizableImage(src,'Assinatura'); showToast('Assinatura inserida ✓'); };
}

(function() {
  let canvas, ctx, wrap;
  let tool = 'pen', color = '#111111', size = 3;
  let drawing = false, startX = 0, startY = 0;
  let wbHistory = [], redoStack = [];
  let snapshot = null;

  window.wb_init = function() {
    wrap   = document.getElementById('wb-wrap');
    canvas = document.getElementById('wb-canvas');
    if (!canvas || !wrap) return;
    ctx = canvas.getContext('2d');
    _resize();
    window.addEventListener('resize', _resize);
    canvas.addEventListener('mousedown',  _start, {passive:false});
    canvas.addEventListener('mousemove',  _move,  {passive:false});
    canvas.addEventListener('mouseup',    _end);
    canvas.addEventListener('mouseleave', _end);
    canvas.addEventListener('touchstart', e => { e.preventDefault(); _start(_toMouse(e)); }, {passive:false});
    canvas.addEventListener('touchmove',  e => { e.preventDefault(); _move(_toMouse(e));  }, {passive:false});
    canvas.addEventListener('touchend',   () => _end());
  };
  function _resize() {
    if (!canvas || !wrap) return;
    const w = wrap.clientWidth, h = wrap.clientHeight;
    const img = ctx ? ctx.getImageData(0,0,canvas.width,canvas.height) : null;
    canvas.width = w; canvas.height = h;
    if (img) ctx.putImageData(img, 0, 0);
  }
  function _toMouse(e) {
    const t = e.touches[0];
    return { clientX:t.clientX, clientY:t.clientY };
  }
  function _pos(e) {
    const r = canvas.getBoundingClientRect();
    return { x:e.clientX-r.left, y:e.clientY-r.top };
  }
  function _saveHistory() {
    wbHistory.push(ctx.getImageData(0,0,canvas.width,canvas.height));
    if (wbHistory.length > 50) wbHistory.shift();
    redoStack = [];
  }
  function _start(e) {
    if (tool === 'text') { _addText(e); return; }
    drawing = true;
    const p = _pos(e);
    startX = p.x; startY = p.y;
    _saveHistory();
    snapshot = ctx.getImageData(0,0,canvas.width,canvas.height);
    ctx.beginPath();
    ctx.strokeStyle = tool==='eraser' ? (document.body.dataset.theme==='dark'?'#1a1a1a':'#ffffff') : color;
    ctx.lineWidth   = tool==='eraser' ? size*3 : (tool==='marker' ? size*2 : size);
    ctx.lineCap     = 'round'; ctx.lineJoin = 'round';
    ctx.globalAlpha = tool==='marker' ? 0.4 : 1;
    ctx.moveTo(startX, startY);
  }
  function _move(e) {
    if (!drawing) return;
    const p = _pos(e);
    if (tool==='pen'||tool==='eraser'||tool==='marker') {
      ctx.lineTo(p.x,p.y); ctx.stroke();
    } else {
      ctx.putImageData(snapshot,0,0);
      ctx.beginPath();
      ctx.strokeStyle = color; ctx.fillStyle = color+'22';
      ctx.lineWidth = size; ctx.globalAlpha = 1;
      if      (tool==='line')   { ctx.moveTo(startX,startY); ctx.lineTo(p.x,p.y); ctx.stroke(); }
      else if (tool==='rect')   { ctx.strokeRect(startX,startY,p.x-startX,p.y-startY); ctx.fillRect(startX,startY,p.x-startX,p.y-startY); }
      else if (tool==='circle') {
        const rx=Math.abs(p.x-startX)/2, ry=Math.abs(p.y-startY)/2;
        const cx=startX+(p.x-startX)/2, cy=startY+(p.y-startY)/2;
        ctx.ellipse(cx,cy,rx,ry,0,0,2*Math.PI); ctx.stroke(); ctx.fill();
      }
    }
  }
  function _end() {
    if (!drawing) return;
    drawing = false; ctx.globalAlpha = 1; ctx.closePath();
  }
  function _addText(e) {
    const p = _pos(e);
    const input = document.createElement('input');
    input.style.cssText = `position:fixed;left:${e.clientX}px;top:${e.clientY}px;font-size:${size*4+12}px;color:${color};background:transparent;border:none;outline:1px dashed ${color};font-family:'Syne',sans-serif;z-index:9999;min-width:80px;`;
    document.body.appendChild(input); input.focus();
    input.addEventListener('blur', () => {
      if (input.value.trim()) {
        _saveHistory();
        ctx.font = `${size*4+12}px Syne,sans-serif`;
        ctx.fillStyle = color; ctx.globalAlpha = 1;
        ctx.fillText(input.value, p.x, p.y);
      }
      input.remove();
    });
    input.addEventListener('keydown', e => { if (e.key==='Enter') input.blur(); });
  }
  window.wb_setTool = function(t) {
    tool = t;
    document.querySelectorAll('[id^="wb-tool-"]').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('wb-tool-'+t);
    if (btn) btn.classList.add('active');
  };
  window.wb_setColor = function(c, el) {
    color = c;
    document.querySelectorAll('.wb-color-swatch').forEach(s => s.classList.remove('active'));
    if (el) el.classList.add('active');
  };
  window.wb_setSize  = function(s) { size = s; };
  window.wb_undo = function() {
    if (!wbHistory.length) return;
    redoStack.push(ctx.getImageData(0,0,canvas.width,canvas.height));
    ctx.putImageData(wbHistory.pop(), 0, 0);
  };
  window.wb_redo = function() {
    if (!redoStack.length) return;
    wbHistory.push(ctx.getImageData(0,0,canvas.width,canvas.height));
    ctx.putImageData(redoStack.pop(), 0, 0);
  };
  window.wb_clear = function() {
    _saveHistory();
    ctx.clearRect(0,0,canvas.width,canvas.height);
  };
  window.wb_export = function() {
    const b64 = canvas.toDataURL('image/png').split(',')[1];
    _sendFlutter({ action:'exportPDF', base64:b64, title:'quadro-branco', isImage:true });
    showToast('Quadro exportado ✓');
  };
  window.wb_aiGenerate = function() {
    _sendFlutter({ action:'modal', type:'gemini', selectedText:'Cria um esquema visual ou diagrama para: ' });
  };
  window.openWhiteboard = function() {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-whiteboard').classList.add('active');
    setTimeout(wb_init, 100);
  };
  window.closeWhiteboard = function() {
    document.getElementById('view-whiteboard').classList.remove('active');
    document.getElementById('view-editor').classList.add('active');
  };
})();

let _activePack = null;
let _iconSize   = 24;
let _allIconsCache = {}; // packId -> filtered list

// Lazy load dos CSS de icon packs — só quando o painel de ícones é aberto pela 1ª vez
const _ICON_PACK_CSS = {
  material:  'https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block',
  bootstrap: 'https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css',
  phosphor:  'https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js', // script
  boxicons:  'https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css',
  remix:     'https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css',
};
const _loadedPacks = new Set();

function _lazyLoadIconPack(packId) {
  if (_loadedPacks.has(packId)) return;
  _loadedPacks.add(packId);
  const url = _ICON_PACK_CSS[packId];
  if (!url) return;
  if (packId === 'phosphor') {
    // É um script JS, não CSS
    const s = document.createElement('script');
    s.src = url; s.async = true;
    document.head.appendChild(s);
  } else {
    const l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = url;
    document.head.appendChild(l);
  }
}

function _buildPackButtons() {
  const container = document.getElementById('icon-packs');
  if (!container || container.children.length > 0) return;
  ICON_PACKS.forEach(pack => {
    const btn = document.createElement('button');
    btn.textContent  = pack.label;
    btn.dataset.pack = pack.id;
    btn.style.cssText = `
      flex-shrink:0;height:28px;padding:0 14px;
      border:1.5px solid var(--border);border-radius:999px;
      background:var(--toolbar-pill);cursor:pointer;
      font-family:'Syne',sans-serif;font-size:.68rem;font-weight:700;
      color:var(--sub);white-space:nowrap;transition:all .12s;`;
    btn.addEventListener('click', () => selectPack(pack.id));
    container.appendChild(btn);
  });
}

function selectPack(packId) {
  _lazyLoadIconPack(packId); // carrega CSS/JS do pack se ainda não carregou
  _activePack = packId;
  document.querySelectorAll('#icon-packs button').forEach(b => {
    const on = b.dataset.pack === packId;
    b.style.background   = on ? 'rgba(var(--acc-rgb),.12)' : 'var(--toolbar-pill)';
    b.style.borderColor  = on ? 'var(--acc)'               : 'var(--border)';
    b.style.color        = on ? 'var(--acc)'               : 'var(--sub)';
  });
  const q = document.getElementById('icon-search')?.value.trim() || '';
  _renderPack(packId, q);
}

function filterIconPack(q) {
  if (_activePack) _renderPack(_activePack, q);
}

function updateIconSize(val) {
  _iconSize = parseInt(val) || 24;
}

function _renderPack(packId, filter) {
  const pack   = ICON_PACKS.find(p => p.id === packId);
  const grid   = document.getElementById('icon-grid');
  const status = document.getElementById('icon-status');
  if (!pack || !grid) return;

  const q = filter.toLowerCase().trim();
  const list = q ? pack.icons.filter(n => n.includes(q)) : pack.icons;

  status.textContent = `${pack.label} · ${list.length} ícones`;

  if (list.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:28px 0;font-family:Syne,sans-serif;font-size:.82rem;color:var(--sub);">Sem resultados</div>';
    return;
  }

  grid.innerHTML = list.map(name => {
    const preview = _iconPreviewHTML(pack, name, 24);
    const display = name.replace(/-/g, ' ');
    return `<button class="icon-btn" onclick="insertPackIcon('${packId}','${name}')" title="${name}">
      ${preview}
      <span class="icon-btn-label">${display.length > 9 ? display.slice(0,9)+'…' : display}</span>
    </button>`;
  }).join('');
}

function _iconPreviewHTML(pack, name, size) {
  if (pack.type === 'element' && pack.id === 'ionicons') {
    return `<ion-icon name="${name}" style="font-size:${size}px;pointer-events:none;"></ion-icon>`;
  }
  if (pack.type === 'ligature') {
    return `<span class="${pack.cls}" style="font-size:${size}px;pointer-events:none;user-select:none;">${name}</span>`;
  }
  if (pack.type === 'element' && pack.id === 'phosphor') {
    const tag = 'ph-' + name;
    return `<${tag} size="${size}" style="pointer-events:none;"></${tag}>`;
  }
  if (pack.type === 'class') {
    const cls = (pack.prefix || '') + name + (pack.suffix || '');
    return `<i class="${cls}" style="font-size:${size}px;pointer-events:none;"></i>`;
  }
  return `<span style="font-size:${size}px;color:var(--sub);">◻</span>`;
}

function insertPackIcon(packId, name) {
  const pack = ICON_PACKS.find(p => p.id === packId);
  const ed   = getActiveEditor(); if (!ed) return;
  const color = document.getElementById('icon-color')?.value || 'currentColor';
  const size  = _iconSize;

  ed.focus(); restoreRange();

  let html = '';

  if (pack.type === 'element' && pack.id === 'ionicons') {
    html = `<ion-icon name="${name}"
      style="font-size:${size}px;color:${color};vertical-align:middle;display:inline-flex;"></ion-icon>`;
  } else if (pack.type === 'ligature') {
    html = `<span class="${pack.cls}"
      style="font-size:${size}px;color:${color};vertical-align:middle;
             display:inline-block;user-select:none;line-height:1;">${name}</span>`;
  } else if (pack.type === 'element' && pack.id === 'phosphor') {
    const tag = 'ph-' + name;
    html = `<${tag} size="${size}" color="${color}"
      style="vertical-align:middle;display:inline-flex;"></${tag}>`;
  } else if (pack.type === 'class') {
    const cls = (pack.prefix || '') + name + (pack.suffix || '');
    html = `<i class="${cls}"
      style="font-size:${size}px;color:${color};vertical-align:middle;display:inline-block;"></i>`;
  }

  if (html) {
    document.execCommand('insertHTML', false, html);
    showToast(`Ícone ${name} inserido ✓`);
  }
}

function searchIcons(val) { filterIconPack(val); }

function insertSymbol(sym) {
  const ed = getActiveEditor(); if (!ed) return;
  ed.focus(); restoreRange();
  document.execCommand('insertHTML', false, sym);
  // Não fecha o painel para inserir múltiplos
  showToast(sym + ' inserido');
}

// ─── Upload de imagem via input[file] ─────────
function handleImageUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const src = e.target.result;
    const ed = getActiveEditor(); if (!ed) return;
    ed.focus(); restoreRange();
    _insertResizableImage(src, file.name.replace(/\.[^.]+$/, ''));
    closeInsertPanel();
    showToast('Imagem inserida ✓');
  };
  reader.readAsDataURL(file);
  // Reset input para permitir o mesmo ficheiro outra vez
  event.target.value = '';
}

// ─── Inserir imagem por URL ───────────────────
function promptImageUrl() {
  const url = prompt('URL da imagem:');
  if (!url) return;
  const ed = getActiveEditor(); if (!ed) return;
  ed.focus(); restoreRange();
  _insertResizableImageUrl(url, 'imagem');
  closeInsertPanel();
  showToast('Imagem inserida ✓');
}

// ─── Câmara (envia para Flutter ou usa WebRTC) ─
function openCamera() {
  // Tenta Flutter nativo primeiro
  if (window.flutter_inappwebview) {
    closeInsertPanel();
    _sendFlutter({ action:'modal', type:'imageUpload', source:'camera' });
    return;
  }
  // Fallback: file input com câmara
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
  input.onchange = function(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const ed = getActiveEditor(); if (!ed) return;
      ed.focus(); restoreRange();
      _insertResizableImage(ev.target.result, 'foto');
      closeInsertPanel(); showToast('Foto inserida ✓');
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

// ─── QR Code ─────────────────────────────────
function insertQrFromPanel() {
  const val = document.getElementById('qr-input')?.value.trim();
  if (!val) { showToast('Insere o texto ou URL'); return; }
  const ed = getActiveEditor(); if (!ed) return;
  ed.focus(); restoreRange();
  _insertQrCode(val);
  document.getElementById('qr-input').value = '';
  closeInsertPanel();
}

// ─── Tabela ───────────────────────────────────
function insertTableFromPanel() {
  const r = parseInt(document.getElementById('tbl-rows')?.value)||3;
  const c = parseInt(document.getElementById('tbl-cols')?.value)||3;
  const headerRow = Array.from({length:c},(_,i)=>`<th style="border:1px solid #ccc;padding:6px 10px;background:rgba(0,0,0,.05);">Cabeçalho ${i+1}</th>`).join('');
  const bodyRow   = Array.from({length:c},()=>`<td style="border:1px solid #ccc;padding:6px 10px;">Célula</td>`).join('');
  const bodyRows  = Array.from({length:Math.max(1,r-1)},()=>`<tr>${bodyRow}</tr>`).join('');
  const ed = getActiveEditor(); if (!ed) return;
  ed.focus(); restoreRange();
  document.execCommand('insertHTML', false,
    `<table style="border-collapse:collapse;width:100%;margin:.5em 0;">
      <thead><tr>${headerRow}</tr></thead>
      <tbody>${bodyRows}</tbody>
    </table><p><br></p>`);
  closeInsertPanel(); showToast('Tabela inserida ✓');
}

// ─── Link ─────────────────────────────────────
function insertLinkFromPanel() {
  const text = document.getElementById('link-text')?.value.trim();
  const url  = document.getElementById('link-url')?.value.trim();
  if (!url) { showToast('Insere o URL'); return; }
  const ed = getActiveEditor(); if (!ed) return;
  ed.focus(); restoreRange();
  document.execCommand('insertHTML', false,
    `<a href="${url}" target="_blank">${text || url}</a>`);
  if (document.getElementById('link-text')) document.getElementById('link-text').value = '';
  if (document.getElementById('link-url'))  document.getElementById('link-url').value  = '';
  closeInsertPanel(); showToast('Link inserido ✓');
}

// ─── Inserções rápidas ─────────────────────────
function insertCode() {
  const ed = getActiveEditor(); if (!ed) return;
  ed.focus(); restoreRange();
  document.execCommand('insertHTML', false,
    '<pre style="background:rgba(0,0,0,.06);border-radius:8px;padding:12px 14px;font-family:\'Space Mono\',monospace;font-size:.82rem;margin:.5em 0;overflow-x:auto;"><code>// código aqui</code></pre><p><br></p>');
  closeInsertPanel(); showToast('Bloco de código inserido');
}
function insertBlockquote() {
  const ed = getActiveEditor(); if (!ed) return;
  ed.focus(); restoreRange();
  document.execCommand('formatBlock', false, 'blockquote');
  closeInsertPanel();
}
function insertHr() {
  const ed = getActiveEditor(); if (!ed) return;
  ed.focus(); restoreRange();
  document.execCommand('insertHorizontalRule', false, null);
  closeInsertPanel();
}
function insertPageBreak() {
  const ed = getActiveEditor(); if (!ed) return;
  ed.focus(); restoreRange();
  document.execCommand('insertHTML', false, '<div style="page-break-after:always;height:0;border-top:1px dashed #ccc;margin:.5em 0;"></div>');
  closeInsertPanel();
}

// ════════════════════════════════════════════════
// PAINEL DE LAYOUT — nativo
// ════════════════════════════════════════════════
function openLayoutPanel() {
  const backdrop = document.getElementById('layout-backdrop');
  const panel    = document.getElementById('layout-panel');
  backdrop.style.display = 'block';
  panel.style.display    = 'block';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    panel.style.transform = 'translateY(0)';
  }));
}
function closeLayoutPanel() {
  const backdrop = document.getElementById('layout-backdrop');
  const panel    = document.getElementById('layout-panel');
  panel.style.transform = 'translateY(100%)';
  setTimeout(() => { panel.style.display='none'; backdrop.style.display='none'; }, 300);
}

function applyFormat(fmt) {
  const formats = { A4:{w:794,h:1123}, A5:{w:559,h:794}, Letter:{w:816,h:1056}, Legal:{w:816,h:1344} };
  const f = formats[fmt]; if (!f) return;
  document.querySelectorAll('.page-wrap').forEach(p => {
    p.style.width = f.w+'px'; p.style.height = f.h+'px';
  });
  applyScale(); showToast('Formato ' + fmt + ' aplicado');
}
function applyMargin(m) {
  const margins = { Estreitas:{v:48,h:48}, Normais:{v:94,h:94}, Largas:{v:120,h:120} };
  const mg = margins[m]; if (!mg) return;
  document.querySelectorAll('.page-wrap').forEach(p => {
    p.style.padding = mg.v+'px '+mg.h+'px';
  });
  showToast('Margem ' + m.toLowerCase());
  // Atualiza botões
  document.querySelectorAll('#layout-panel .lay-btn').forEach(b => {
    if (b.textContent.trim() === m) b.classList.add('lay-btn-active');
    else b.classList.remove('lay-btn-active');
  });
}
function applySpacing(val) {
  document.querySelectorAll('.page-editor').forEach(p => { p.style.lineHeight = val; });
  showToast('Espaçamento ' + val);
}
function applyPaperTheme(t) {
  _whitePaperForced = t === 'white';
  document.querySelectorAll('.page-wrap').forEach(p => {
    p.style.background = _whitePaperForced ? '#ffffff' : '';
    p.querySelector('.page-editor').style.color = _whitePaperForced ? '#111111' : '';
  });
  showToast(t === 'white' ? 'Papel branco activado' : 'Papel automático');
}

// ════════════════════════════════════════════════
// BRIDGE BIDIRECIONAL (postMessage para iframe web)
// ════════════════════════════════════════════════
window.addEventListener('message', function(e) {
  const d = e.data; if (!d || typeof d !== 'object') return;
  if      (d.action==='load')         window.loadDocument(d.id, d.title, d.html||'');
  else if (d.action==='setTitle')     window.setDocTitle(d.title);
  else if (d.action==='requestSave')  window.saveDocument();
});

// ════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════
window.addEventListener('load', function() {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ action:'editorReady' }, '*');
  }
  if (pages.length === 0) {
    createPage(0);
    applyScale();
    updateMeta();
  }
  if (window._pendingDocx) {
    setTimeout(() => {
      if (typeof window.loadDocxBase64 === 'function') {
        window.loadDocxBase64(window._pendingDocx);
        window._pendingDocx = null;
      }
    }, 500);
  }
});
