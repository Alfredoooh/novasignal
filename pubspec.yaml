name: sportshub
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  
  # WebView
  webview_flutter: ^4.4.4
  webview_flutter_android: ^3.14.0
  webview_flutter_wkwebview: ^3.10.0
  
  # HTTP
  http: ^1.1.2
  
  # Splash Screen
  flutter_native_splash: ^2.3.8
  
  # SVG
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.3.8
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/splash_logo.png
    - assets/splash_text.svg

# Configuração do Splash Screen
flutter_native_splash:
  color: "#18191A"
  image: assets/splash_logo.png
  
  color_dark: "#18191A"
  image_dark: assets/splash_logo.png
  
  android_12:
    image: assets/splash_logo.png
    color: "#18191A"
    icon_background_color: "#18191A"
  
  ios: true
  web: false
  
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  
  android: true
  android_disable_fullscreen: false