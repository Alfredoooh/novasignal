name: novasignal
description: A modern Flutter application with theme and language support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  webview_flutter: any
  http: any
  flutter_staggered_grid_view: any

  # Nova dependência obrigatória para extração de cor
  palette_generator: any

  dio: any
  open_file: any

  # State management and storage
  shared_preferences: ^2.2.2

  # SVG support
  flutter_svg: ^2.0.9

  # UI & Animations
  flutter_svg: any
  flutter_staggered_grid_view: any
  
  # Sharing & Export
  share_plus: any
  pdf: any
  path_provider: any
  
  # State Management (se necessário)
  provider: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

    # Ícones existentes
    - assets/icons/plus.svg
    - assets/icons/sparkle.svg
    - assets/icons/home.svg
    - assets/icons/settings.svg
    - assets/icons/check.svg
    - assets/icons/close.svg
    - assets/icons/arrow_back.svg
    - assets/icons/chevron_right.svg
    - assets/icons/refresh.svg
    - assets/icons/error.svg
    - assets/icons/inbox.svg
    - assets/icons/share.svg
    - assets/icons/download.svg
    - assets/icons/play.svg
    - assets/icons/star.svg
    - assets/icons/business.svg
    - assets/icons/academic.svg
    - assets/icons/personal.svg
    - assets/icons/legal.svg
    - assets/icons/creative.svg
    - assets/icons/document.svg
    - assets/icons/edit.svg
    - assets/icons/responsive.svg
    - assets/icons/pallette.svg

    # ---------------------------
    #   NOVOS ÍCONES ADICIONADOS
    # ---------------------------

    # Navegação
    - assets/icons/menu.svg

    # Ações
    - assets/icons/heart.svg
    - assets/icons/heart_filled.svg
    - assets/icons/alert.svg
    - assets/icons/filter.svg

    # Categorias extras
    - assets/icons/finance.svg
    - assets/icons/health.svg
    - assets/icons/education.svg
    - assets/icons/technology.svg
    - assets/icons/marketing.svg
    - assets/icons/sports.svg
