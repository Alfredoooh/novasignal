name: novasignal
description: A modern Flutter application with theme and language support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management and storage
  shared_preferences: ^2.2.2
  
  # SVG support
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    # Ícones SVG
    - assets/plus.svg
    - assets/sparkle.svg
    - assets/home.svg
    - assets/settings.svg
    - assets/check.svg
    - assets/close.svg
    - assets/arrow_back.svg
    - assets/chevron_right.svg
