name: novasignal
description: A modern Flutter application with theme and language support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  webview_flutter: any
  http: any
  flutter_staggered_grid_view: any
  palette_generator: any
  dio: any
  path_provider: any
  open_file: any
  
  # State management and storage
  shared_preferences: ^2.2.2
  
  # SVG support
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    # Ícones SVG
    - assets/icons/plus.svg
    - assets/icons/sparkle.svg
    - assets/icons/home.svg
    - assets/icons/settings.svg
    - assets/icons/check.svg
    - assets/icons/close.svg
    - assets/icons/arrow_back.svg
    - assets/icons/chevron_right.svg
    - assets/icons/refresh.svg
    - assets/icons/error.svg
    - assets/icons/inbox.svg
    - assets/icons/share.svg
    - assets/icons/download.svg
    - assets/icons/play.svg
    - assets/icons/star.svg
    - assets/icons/business.svg
    - assets/icons/academic.svg
    - assets/icons/personal.svg
    - assets/icons/legal.svg
    - assets/icons/creative.svg
    - assets/icons/document.svg
    - assets/icons/edit.svg
    - assets/icons/responsive.svg
    - assets/icons/pallette.svg
