
name: novasignal
description: Aplicativo de trading Deriv em Flutter com WebView
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  flutter_inappwebview: ^6.0.0
  flutter_svg: ^2.0.10+1
  animations: ^2.0.11
  image_picker: any
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  intl: ^0.19.0
  share_plus: ^10.0.3
  path_provider: ^2.1.3
  open_file: ^3.3.2
  permission_handler: ^11.3.1
  path: ^1.9.0
  mime: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.3.8
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/editor/editor.html
    - assets/splash_logo.png
    - assets/splash_text.svg
    - assets/icons/ic_documento.png
    - assets/icons/ic_apresentacao.png
    - assets/icons/ic_cv.png
    - assets/icons/ic_nota.png

# Configuração do Splash Screen
flutter_native_splash:
  color: "#18191A"
  image: assets/splash_logo.png

  color_dark: "#18191A"
  image_dark: assets/splash_logo.png

  android_12:
    image: assets/splash_logo.png
    color: "#18191A"
    icon_background_color: "#18191A"

  android: true
  ios: false  # DESABILITADO - reduz tamanho
  web: false

  android_gravity: center
  fullscreen: true
  android_disable_fullscreen: false