
name: novasignal
description: Aplicativo de trading Deriv em Flutter com WebView
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # WebSocket
  web_socket_channel: ^2.4.0
  feather_icons: any
  flutter_inappwebview: any
  # WebView para gráficos LightweightCharts
  flutter_inappwebview: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.3.8
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/splash_logo.png
    - assets/splash_text.svg
    - assets/flash_icon.png
    - assets/shop_icon.png
    - assets/fire_icon.png
    - assets/like_animation.gif
    - assets/empty_store.png
    - assets/error_state.png

# Configuração do Splash Screen
flutter_native_splash:
  color: "#18191A"
  image: assets/splash_logo.png

  color_dark: "#18191A"
  image_dark: assets/splash_logo.png

  android_12:
    image: assets/splash_logo.png
    color: "#18191A"
    icon_background_color: "#18191A"

  android: true
  ios: false  # DESABILITADO - reduz tamanho
  web: false

  android_gravity: center
  fullscreen: true
  android_disable_fullscreen: false