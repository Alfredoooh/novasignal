name: sportshub
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # WebView - SÓ Android (remove iOS webview)
  #webview_flutter: ^4.11.2
  #webview_flutter_android: ^3.18.2
  
  # HTTP - versão específica mais leve
  #http: ^1.2.2

  # SVG - versão específica
  flutter_svg: ^2.0.10
  
  # Ícones - versão específica
  material_symbols_icons: ^4.2785.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.3.8
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/splash_logo.png
    - assets/splash_text.svg

# Configuração do Splash Screen
flutter_native_splash:
  color: "#18191A"
  image: assets/splash_logo.png

  color_dark: "#18191A"
  image_dark: assets/splash_logo.png

  android_12:
    image: assets/splash_logo.png
    color: "#18191A"
    icon_background_color: "#18191A"

  android: true
  ios: false  # DESABILITADO - reduz tamanho
  web: false

  android_gravity: center
  fullscreen: true
  android_disable_fullscreen: false