name: novasignal
description: A modern Flutter application with theme and language support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cached_network_image: any
  url_launcher: any
  ionicons: any
  cupertino_icons: any
  webview_flutter: any
  mobile_scanner: any
  image_picker: any
  http: any
  qr_flutter: any
  flutter_staggered_grid_view: any
  intl: ^0.18.1
  flutter_html: any
  dynamic_color: any
  shimmer: any
  glassmorphism: any

  # Nova dependência obrigatória para extração de cor
  palette_generator: any
  material_symbols_icons: any

  dio: any
  open_file: any

  # State management and storage
  shared_preferences: ^2.2.2

  # SVG support
  flutter_svg: ^2.0.9

  # UI & Animations

  # Sharing & Export
  share_plus: any
  pdf: any
  path_provider: any
  animations: any
  
  # State Management (se necessário)
  provider: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/gold_medal.png
    - assets/silver_medal.png
    - assets/bronze_medal.png
    - assets/icons/soccer_ball.png
    - assets/icons/assist.png
    - assets/icons/var.png
    - assets/images/trading_background.png
    - assets/winner.gif