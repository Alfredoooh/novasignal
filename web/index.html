<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aria — Editor de documentos">

  <!-- Carrega Syne do Google Fonts para Flutter Web ter a fonte certa -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Aria">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Aria</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #ffffff;
      font-family: 'Syne', sans-serif;
      overflow: hidden;
    }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #fff; z-index: 9999;
      flex-direction: column; gap: 16px;
    }
    #loading-logo {
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 2rem;
    }
    #loading-logo span { color: #e0185e; }
    .loading-bar {
      width: 40px; height: 3px; background: #f0f0f0; border-radius: 2px; overflow: hidden;
    }
    .loading-bar-inner {
      height: 100%; background: #e0185e; border-radius: 2px;
      animation: loadbar 1.2s ease-in-out infinite;
    }
    @keyframes loadbar {
      0% { width: 0%; margin-left: 0; }
      50% { width: 100%; margin-left: 0; }
      100% { width: 0%; margin-left: 100%; }
    }
  </style>
</head>
<body>
  <!-- Ecrã de loading enquanto o Flutter carrega -->
  <div id="loading">
    <div id="loading-logo">A<span>ria</span></div>
    <div class="loading-bar"><div class="loading-bar-inner"></div></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      const l = document.getElementById('loading');
      if (l) { l.style.opacity = '0'; l.style.transition = 'opacity .3s'; setTimeout(() => l.remove(), 350); }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
