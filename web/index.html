<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DocuGen - AI Document Generator">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DocuGen">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DocuGen</title>
  <link rel="manifest" href="manifest.json">

  <!-- Bibliotecas PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>

  <style>
    body {
      margin: 0;
      background: #1C1C1E;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1C1C1E;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* iOS Activity Indicator */
    .spinner {
      width: 40px;
      height: 40px;
      position: relative;
    }

    .spinner div {
      position: absolute;
      width: 3px;
      height: 10px;
      background: #fff;
      border-radius: 2px;
      opacity: 0.3;
      animation: fade 1s linear infinite;
    }

    .spinner div:nth-child(1) { transform: rotate(0deg) translate(0, -15px); animation-delay: 0s; }
    .spinner div:nth-child(2) { transform: rotate(30deg) translate(0, -15px); animation-delay: -0.917s; }
    .spinner div:nth-child(3) { transform: rotate(60deg) translate(0, -15px); animation-delay: -0.833s; }
    .spinner div:nth-child(4) { transform: rotate(90deg) translate(0, -15px); animation-delay: -0.75s; }
    .spinner div:nth-child(5) { transform: rotate(120deg) translate(0, -15px); animation-delay: -0.667s; }
    .spinner div:nth-child(6) { transform: rotate(150deg) translate(0, -15px); animation-delay: -0.583s; }
    .spinner div:nth-child(7) { transform: rotate(180deg) translate(0, -15px); animation-delay: -0.5s; }
    .spinner div:nth-child(8) { transform: rotate(210deg) translate(0, -15px); animation-delay: -0.417s; }
    .spinner div:nth-child(9) { transform: rotate(240deg) translate(0, -15px); animation-delay: -0.333s; }
    .spinner div:nth-child(10) { transform: rotate(270deg) translate(0, -15px); animation-delay: -0.25s; }
    .spinner div:nth-child(11) { transform: rotate(300deg) translate(0, -15px); animation-delay: -0.167s; }
    .spinner div:nth-child(12) { transform: rotate(330deg) translate(0, -15px); animation-delay: -0.083s; }

    @keyframes fade {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>

  <script>
    var serviceWorkerVersion = null;
  </script>
  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        }
      }).then(function(engineInitializer) {
        return engineInitializer.initializeEngine();
      }).then(function(appRunner) {
        return appRunner.runApp();
      }).then(function() {
        document.getElementById('loading').classList.add('hidden');
      });
    });
  </script>
</body>
</html>
